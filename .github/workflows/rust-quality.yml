name: Rust Quality Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    # scripts/rust-ci.sh runs `cargo test --workspace`, and the integration
    # tests in tests/ spawn a real server via build_state(), which connects to
    # MongoDB. Without this service they fail before asserting anything.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run quality gate
        run: ./scripts/rust-ci.sh

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install security tooling
        run: |
          cargo install cargo-deny --locked
          cargo install cargo-audit --locked

      - name: Run security checks
        run: ./scripts/rust-security.sh
