name: Deploy Noodle Bot

on:
  push:
    branches:
      - main  # Change this to your default branch if different
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: read

jobs:
  # Gate deploys on the same checks scripts/rust-ci.sh runs locally. This job
  # is duplicated from rust-quality.yml rather than reused: pulling in that
  # whole workflow would also block deploys on the advisory scan, which can
  # start failing because of a newly published RUSTSEC entry that has nothing
  # to do with a given push. Advisories still run on every pull request.
  quality:
    name: Quality
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run quality gate
        run: ./scripts/rust-ci.sh

  deploy:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}  # Default is 22
          script: |
            # Navigate to the container directory
            cd /home/mok/containers/zgaf-matrix-rust

            rm -rf Chatter

            # Clone the repository
            git clone https://github.com/Sphyrna-029/Chatter

            cd Chatter

            # Checkout rust branch
            # git checkout refactor/rust-rewrite

            cp ../control.sh .

            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ./control.sh build
            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ./control.sh stop
            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ./control.sh start
