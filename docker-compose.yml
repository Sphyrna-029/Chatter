services:
  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    ports:
      - 127.0.0.1:27017:27017

  chatter:
    build: .
    ports:
      - 127.0.0.1:8067:8000/tcp
      - 127.0.0.1:8067:8000/udp
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}

      # This instance's public https URL. Not tied to one integration: the
      # Steam login flow builds its return address from it, and Web Push signs
      # with it when VAPID_SUBJECT is unset.
      #SERVER_URL: https://yourdomain.com

      #################  KLIPY  #################
      #KLIPY_API_KEY: your-klipy-key (for gif pallette)

      ###############  WEB PUSH  ###############
      # How a push service reaches whoever runs this instance. Left unset, and
      # with no https SERVER_URL above, notifications are signed as
      # mailto:admin@localhost — not a real address. Services differ on whether
      # they accept that, so it tends to show up as push arriving on one
      # browser and not another rather than as a clear failure. The server
      # warns at boot when it has fallen back.
      #VAPID_SUBJECT: mailto:you@example.com
      # Optional: the server mints a keypair on first boot and keeps it. Set
      # this only to hold the key outside the database. Changing it, or losing
      # the stored pair, invalidates every subscription already enrolled —
      # devices re-enrol themselves, but each has to open the app first.
      #VAPID_PRIVATE_KEY: base64url-raw-p256-scalar

      #################  STEAM  #################
      #STEAM_API_KEY: steam integration

      ################  SPOTIFY  ################
      #SPOTIFY_CLIENT_ID: spotify integration
      #SPOTIFY_CLIENT_SECRET: spotify integration
      #Set spotify redirect URI to https://yourdomain.com/api/auth/spotify/callback

      ################  WEBRTC  ################
      #WEBRTC_IP: your-public-ip (required if behind NAT; LAN clients connect via local IP automatically)
      #WEBRTC_UDP_PORT: 8000 (all media is multiplexed onto this one UDP port; must match the udp mapping above)
      TURN_URL: "turn:host.docker.internal:3478"
      #TURN_PUBLIC_URL: "turn:yourdomain.com:3478" (client-facing TURN address, falls back to TURN_URL)
      TURN_USERNAME: ${TURN_USERNAME:-chatter}
      TURN_PASSWORD: ${TURN_PASSWORD:-changeme}

    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/external
    depends_on:
      - mongodb
      - coturn
    restart: unless-stopped
    #labels:
    #Traefik reverse proxy example config
    #traefik.enable: "true"
    #traefik.http.routers.chatter.entrypoints: "your-https-entrypoint"
    #traefik.http.routers.chatter.rule: "Host(`yourdomain.com`)"
    #traefik.http.routers.chatter.tls.certResolver: "your-tls-resolver"
    #traefik.http.routers.chatter.tls: "true"

  coturn:
    image: coturn/coturn:latest
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped

volumes:
  mongo_data:
  uploads:
