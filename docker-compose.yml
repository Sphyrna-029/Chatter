services:
  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    ports:
      - 127.0.0.1:27017:27017

  chatter:
    build: .
    ports:
      - 127.0.0.1:8067:8000/tcp
      - 127.0.0.1:8067:8000/udp
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}

      #################  KLIPY  #################
      #KLIPY_API_KEY: your-klipy-key (for gif pallette)

      #################  STEAM  #################
      #STEAM_API_KEY: steam integration
      #SERVER_URL: https://yourdomain.com (for steam integration)

      ################  SPOTIFY  ################
      #SPOTIFY_CLIENT_ID: spotify integration
      #SPOTIFY_CLIENT_SECRET: spotify integration
      #Set spotify redirect URI to https://yourdomain.com/api/auth/spotify/callback

      ################  WEBRTC  ################
      #WEBRTC_IP: your-public-ip (required if behind NAT; LAN clients connect via local IP automatically)
      TURN_URL: "turn:host.docker.internal:3478"
      TURN_USERNAME: ${TURN_USERNAME:-chatter}
      TURN_PASSWORD: ${TURN_PASSWORD:-changeme}

    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/external
    depends_on:
      - mongodb
      - coturn
    restart: unless-stopped
    #labels:
    #Traefik reverse proxy example config
    #traefik.enable: "true"
    #traefik.http.routers.chatter.entrypoints: "your-https-entrypoint"
    #traefik.http.routers.chatter.rule: "Host(`yourdomain.com`)"
    #traefik.http.routers.chatter.tls.certResolver: "your-tls-resolver"
    #traefik.http.routers.chatter.tls: "true"

  coturn:
    image: coturn/coturn:latest
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped

volumes:
  mongo_data:
  uploads:
