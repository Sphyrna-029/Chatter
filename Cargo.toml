[package]
name = "chatter"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors", "fs"] }
webrtc = "0.11"
rtp = "0.11"
rtcp = "0.11"

[profile.release]
opt-level = 3
lto = true
