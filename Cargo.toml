[package]
name = "chatter"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors", "fs"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json", "multipart", "gzip", "brotli", "deflate"], default-features = false }
percent-encoding = "2"
url = "2"
urlencoding = "2"
regex = "1"
mime_guess = "2"
webrtc = "0.11"
rtp = "0.11"
rtcp = "0.11"
mongodb = "3"
jsonwebtoken = "9"
argon2 = "0.5"
totp-rs = { version = "5", features = ["qr", "otpauth"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
dotenvy = "0.15"
mlua = { version = "0.10", features = ["lua54", "send", "serialize", "vendored"] }

[dev-dependencies]
tokio-tungstenite = "0.24"

[profile.release]
opt-level = 3
lto = "thin"
