        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                ws.send(JSON.stringify({ access_token: accessToken }));
            };

            ws.onmessage = async (event) => {
                if (event.data instanceof ArrayBuffer) {
                    // Check if it's a screen share frame or audio
                    const view = new Uint8Array(event.data);
                    const headerText = new TextDecoder().decode(view.slice(0, 7));
                    
                    if (headerText === 'SCREEN:') {
                        // Screen share frame: SCREEN:<user_id>\n<jpeg_data>
                        const payload = view.slice(7);
                        // Find the newline delimiter separating user_id from jpeg data
                        const newlineIdx = payload.indexOf(10); // 10 = '\n'
                        if (newlineIdx !== -1) {
                            const sharerUserId = new TextDecoder().decode(payload.slice(0, newlineIdx));
                            const imageData = payload.slice(newlineIdx + 1);
                            if (inVoiceChannel && activeScreenSharers.has(sharerUserId)) {
                                displayScreenShare(imageData, sharerUserId);
                            }
                        }
                    } else if (headerText.startsWith('AUDIO:')) {
                        // Audio data - only play if in voice
                        const audioData = view.slice(6);
                        if (inVoiceChannel) {
                            await playAudioChunk(audioData.buffer);
                        }
                    } else {
                        // Legacy audio without header - only play if in voice
                        if (inVoiceChannel) {
                            await playAudioChunk(event.data);
                        }
                    }
                } else {
                    // JSON message
                    const message = JSON.parse(event.data);
                    handleWebSocketMessage(message);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onclose = () => {
                console.log('WebSocket closed');
                setTimeout(connectWebSocket, 3000);
            };
        }

        function handleWebSocketMessage(message) {
            if (message.type === 'connected') {
                console.log('WebSocket connected');
            } else if (message.type === 'm.room.message') {
                if (message.room_id === currentRoomId) {
                    displayMessage(message);
                }
            } else if (message.type === 'm.room.member') {
                console.log('Member event:', message);
                if (message.room_id === currentRoomId) {
                    loadRoomMembers(currentRoomId);
                }
            } else if (message.type === 'm.room.redaction') {
                // Handle message deletion
                if (message.room_id === currentRoomId) {
                    const messageDiv = document.querySelector(`[data-event-id="${message.redacts}"]`);
                    if (messageDiv) {
                        const messageBody = messageDiv.querySelector('.message-body');
                        messageBody.textContent = '[deleted]';
                        messageBody.classList.add('deleted');
                    }
                }
            } else if (message.type === 'm.reaction') {
                // Handle reaction update
                if (message.room_id === currentRoomId) {
                    messageReactions[message.event_id] = message.reactions;
                    updateMessageReactions(message.event_id, message.reactions);
                }
            } else if (message.type === 'user_typing') {
                // Update typing status
                if (message.room_id === currentRoomId && message.user_id !== userId) {
                    if (userPresence[message.user_id]) {
                        userPresence[message.user_id].status = 'active';
                        userPresence[message.user_id].last_typing = Date.now() / 1000;
                    } else {
                        userPresence[message.user_id] = {
                            status: 'active',
                            last_typing: Date.now() / 1000
                        };
                    }
                    displayMembers();
                }
            } else if (message.type === 'voice_user_joined') {
                if (message.room_id === currentRoomId) {
                    voiceMembers.add(message.user_id);
                    if (!voiceMemberStates[message.user_id]) {
                        voiceMemberStates[message.user_id] = {
                            muted: false,
                            screen_sharing: false
                        };
                    }
                    updateVoiceMembersList();
                }
            } else if (message.type === 'voice_user_left') {
                if (message.room_id === currentRoomId) {
                    voiceMembers.delete(message.user_id);
                    delete voiceMemberStates[message.user_id];
                    updateVoiceMembersList();
                    
                    // If the person who left was screen sharing, hide their stream
                    if (activeScreenSharers.has(message.user_id)) {
                        hideScreenShare(message.user_id);
                    }
                }
            } else if (message.type === 'voice_user_muted') {
                if (message.room_id === currentRoomId) {
                    // Update member state
                    if (voiceMemberStates[message.user_id]) {
                        voiceMemberStates[message.user_id].muted = message.muted;
                    } else {
                        voiceMemberStates[message.user_id] = {
                            muted: message.muted,
                            screen_sharing: false
                        };
                    }
                    updateVoiceMembersList();
                }
            } else if (message.type === 'screen_share_started') {
                if (message.room_id === currentRoomId) {
                    activeScreenSharers.add(message.user_id);
                    if (voiceMemberStates[message.user_id]) {
                        voiceMemberStates[message.user_id].screen_sharing = true;
                    }
                    updateVoiceMembersList();
                }
            } else if (message.type === 'screen_share_stopped') {
                if (message.room_id === currentRoomId) {
                    hideScreenShare(message.user_id);
                    if (voiceMemberStates[message.user_id]) {
                        voiceMemberStates[message.user_id].screen_sharing = false;
                    }
                    updateVoiceMembersList();
                }
            }
        }

        // Periodically refresh presence data
        setInterval(async () => {
            if (currentRoomId) {
                await loadPresence(currentRoomId);
                displayMembers();
            }
        }, 10000); // Refresh every 10 seconds

        // Room management
        async function loadRooms() {
            try {
                const response = await fetch('/_matrix/client/r0/joined_rooms', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    joinedRooms = data.joined_rooms;
                    await displayRooms();
                }
            } catch (error) {
                console.error('Error loading rooms:', error);
            }
        }

        async function displayRooms() {
            const roomsList = document.getElementById('roomsList');
            roomsList.innerHTML = '';

            if (joinedRooms.length === 0) {
                roomsList.innerHTML = '<div class="text-muted">No rooms joined yet</div>';
                return;
            }

            for (const roomId of joinedRooms) {
                try {
                    const response = await fetch(`/_matrix/client/r0/sync?timeout=0`, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        const roomData = data.rooms.join[roomId];

                        if (roomData) {
                            const nameEvent = roomData.state.events.find(e => e.type === 'm.room.name');
                            const topicEvent = roomData.state.events.find(e => e.type === 'm.room.topic');

                            const roomDiv = document.createElement('div');
                            roomDiv.className = 'room-item';
                            if (roomId === currentRoomId) roomDiv.classList.add('active');
                            roomDiv.dataset.roomId = roomId;
                            
                            roomDiv.innerHTML = `
                                <div class="room-mention-badge ${roomMentions[roomId] && roomId !== currentRoomId ? 'show' : ''}"></div>
                                <div class="room-name">${nameEvent?.content.name || 'Unnamed Room'}</div>
                                <div class="room-topic">${topicEvent?.content.topic || 'No topic'}</div>
                            `;

                            // Add click handler for room selection
                            roomDiv.onclick = (e) => {
                                // Don't select room if clicking the leave button
                                if (!e.target.classList.contains('room-leave-btn')) {
                                    selectRoom(roomId);
                                }
                            };

                            // Add leave button
                            const leaveBtn = document.createElement('button');
                            leaveBtn.className = 'room-leave-btn';
                            leaveBtn.textContent = 'Leave';
                            leaveBtn.onclick = (e) => {
                                e.stopPropagation();
                                leaveRoom(roomId);
                            };
                            roomDiv.appendChild(leaveBtn);

                            roomsList.appendChild(roomDiv);
                        }
                    }
                } catch (error) {
                    console.error('Error fetching room details:', error);
                }
            }
        }

        async function selectRoom(roomId) {
            // Leave voice if switching rooms
            if (inVoiceChannel && currentRoomId !== roomId) {
                await leaveVoice();
            }

            currentRoomId = roomId;
            
            // Clear mention badge for this room
            roomMentions[roomId] = false;
            
            await displayRooms();
            await loadMessages(roomId);
            await loadRoomMembers(roomId);
            
            // Load voice channel status (even if not in voice)
            voiceMembers.clear();
            await loadVoiceMembers();
        }

        async function loadMessages(roomId) {
            try {
                const response = await fetch(`/_matrix/client/r0/rooms/${roomId}/messages?limit=50`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // Get room info
                    const syncResponse = await fetch(`/_matrix/client/r0/sync?timeout=0`, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                    
                    if (syncResponse.ok) {
                        const syncData = await syncResponse.json();
                        const roomData = syncData.rooms.join[roomId];
                        const nameEvent = roomData.state.events.find(e => e.type === 'm.room.name');
                        const topicEvent = roomData.state.events.find(e => e.type === 'm.room.topic');
                        
                        document.getElementById('currentRoomName').textContent = nameEvent?.content.name || 'Unnamed Room';
                        document.getElementById('currentRoomTopic').textContent = topicEvent?.content.topic || 'No topic';
                    }

                    const messagesContainer = document.getElementById('messagesContainer');
                    messagesContainer.innerHTML = '';

                    data.chunk.forEach(message => {
                        if (message.type === 'm.room.message') {
                            displayMessage(message);
                        }
                    });

                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        async function loadRoomMembers(roomId) {
            try {
                const response = await fetch(`/_matrix/client/r0/sync?timeout=0`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    const roomData = data.rooms.join[roomId];
                    
                    if (roomData) {
                        const memberEvents = roomData.state.events.filter(e => e.type === 'm.room.member');
                        currentRoomMembers = memberEvents.map(e => ({
                            userId: e.state_key,
                            displayName: e.content.displayname || e.state_key.split(':')[0].substring(1)
                        }));
                        
                        // Load presence data
                        await loadPresence(roomId);
                        
                        displayMembers();
                    }
                }
            } catch (error) {
                console.error('Error loading room members:', error);
            }
        }

        async function loadPresence(roomId) {
            try {
                const response = await fetch(`/api/rooms/${roomId}/presence`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    userPresence = data.presence;
                }
            } catch (error) {
                console.error('Error loading presence:', error);
            }
        }

        function displayMembers() {
            const membersList = document.getElementById('membersList');
            const memberCount = document.getElementById('memberCount');
            
            memberCount.textContent = currentRoomMembers.length;
            membersList.innerHTML = '';

            currentRoomMembers.forEach(member => {
                const presence = userPresence[member.userId] || { status: 'offline' };
                const statusClass = presence.status;
                
                const memberDiv = document.createElement('div');
                memberDiv.className = `member-item ${statusClass === 'offline' ? 'offline' : ''}`;
                
                const initial = member.displayName.substring(0, 1).toUpperCase();
                
                memberDiv.innerHTML = `
                    <div class="member-avatar">
                        ${initial}
                        <div class="presence-indicator ${statusClass}"></div>
                    </div>
                    <div class="member-name">${escapeHtml(member.displayName)}</div>
                `;
                
                membersList.appendChild(memberDiv);
            });
        }

        function processMessageBody(body) {
            // Escape HTML first
            let escaped = escapeHtml(body);
            
            // Process @mentions - match @username pattern
            escaped = escaped.replace(/@(\w+)/g, (match, username) => {
                const mentionedUserId = `@${username}:localhost`;
                const isSelfMention = mentionedUserId === userId;
                return `<span class="mention${isSelfMention ? ' self-mention' : ''}" data-user-id="${mentionedUserId}">${match}</span>`;
            });
            
            // Convert URLs to clickable links and detect images
            return escaped.replace(urlRegex, (url) => {
                if (imageExtensions.test(url)) {
                    // It's an image URL
                    return `<a href="${url}" target="_blank">${url}</a><br><img src="${url}" alt="Image" loading="lazy" onerror="this.style.display='none'">`;
                } else {
                    // Regular link
                    return `<a href="${url}" target="_blank">${url}</a>`;
                }
            });
        }

        function displayMessage(message) {
            const messagesContainer = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.dataset.eventId = message.event_id;

            const sender = message.sender.split(':')[0].substring(1);
            const time = new Date(message.origin_server_ts).toLocaleTimeString([], { 
                hour: '2-digit', 
                minute: '2-digit' 
            });

            const processedBody = processMessageBody(message.content.body);
            const isDeleted = message.redacted || message.content.body === '[deleted]';
            const isOwnMessage = message.sender === userId;

            // Check if this message mentions the current user
            const myUsername = userId.split(':')[0].substring(1);
            const mentionsMe = message.content.body.includes(`@${myUsername}`);
            
            // If we're mentioned and this isn't the current room, mark it
            if (mentionsMe && message.room_id !== currentRoomId) {
                roomMentions[message.room_id] = true;
                displayRooms(); // Update room badges
            }

            messageDiv.innerHTML = `
                <div class="message-header">
                    <div class="message-avatar">${sender.substring(0, 1).toUpperCase()}</div>
                    <span class="message-sender">${escapeHtml(sender)}</span>
                    <span class="message-time">${time}</span>
                </div>
                <div class="message-body ${isDeleted ? 'deleted' : ''}">
                    ${processedBody}
                    <div class="message-actions"></div>
                </div>
            `;

            messagesContainer.appendChild(messageDiv);
            
            // Add action buttons with proper event handlers
            const actionsDiv = messageDiv.querySelector('.message-actions');
            if (actionsDiv && !isDeleted) {
                // Add react button
                const reactBtn = document.createElement('button');
                reactBtn.className = 'btn-react';
                reactBtn.textContent = '😊';
                reactBtn.onclick = (e) => showReactionPicker(message.event_id, message.room_id, e);
                actionsDiv.appendChild(reactBtn);
                
                // Add delete button for own messages
                if (isOwnMessage) {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'btn-delete';
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.onclick = () => deleteMessage(message.event_id, message.room_id);
                    actionsDiv.appendChild(deleteBtn);
                }
            }
            
            // Load reactions if they exist
            if (message.event_id && messageReactions[message.event_id]) {
                updateMessageReactions(message.event_id, messageReactions[message.event_id]);
            }
            
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function deleteMessage(eventId, roomId) {
            if (!confirm('Are you sure you want to delete this message?')) {
                return;
            }

            try {
                const txnId = Date.now();
                const response = await fetch(
                    `/_matrix/client/r0/rooms/${roomId}/redact/${eventId}/${txnId}`,
                    {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${accessToken}`
                        }
                    }
                );

                if (response.ok) {
                    // Update the message in UI
                    const messageDiv = document.querySelector(`[data-event-id="${eventId}"]`);
                    if (messageDiv) {
                        const messageBody = messageDiv.querySelector('.message-body');
                        messageBody.textContent = '[deleted]';
                        messageBody.classList.add('deleted');
                    }
                }
            } catch (error) {
                console.error('Error deleting message:', error);
                alert('Failed to delete message');
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const body = input.value.trim();

            if (!body || !currentRoomId) return;

            try {
                const txnId = Date.now();
                const response = await fetch(
                    `/_matrix/client/r0/rooms/${currentRoomId}/send/m.room.message/${txnId}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${accessToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            msgtype: 'm.text',
                            body: body
                        })
                    }
                );

                if (response.ok) {
                    input.value = '';
                }
            } catch (error) {
                console.error('Error sending message:', error);
            }
        }

        function handleMessageKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Send typing indicator
        function sendTypingIndicator() {
            if (!currentRoomId || !ws || ws.readyState !== WebSocket.OPEN) return;
            
            // Clear existing timeout
            if (typingTimeout) {
                clearTimeout(typingTimeout);
            }
            
            // Send typing event
            ws.send(JSON.stringify({
                type: 'typing',
                room_id: currentRoomId
            }));
            
            // Set timeout to prevent spamming
            typingTimeout = setTimeout(() => {
                typingTimeout = null;
            }, 1000);
        }

        // Mention autocomplete
        let mentionAutocompleteActive = false;
        let mentionStartPos = -1;
        let selectedMentionIndex = 0;

        function handleMentionAutocomplete(event) {
            const input = document.getElementById('messageInput');
            const value = input.value;
            const cursorPos = input.selectionStart;
            
            // Find @ before cursor
            const textBeforeCursor = value.substring(0, cursorPos);
            const lastAtIndex = textBeforeCursor.lastIndexOf('@');
            
            if (lastAtIndex !== -1 && lastAtIndex === textBeforeCursor.length - 1 || 
                (lastAtIndex !== -1 && /^@\w*$/.test(textBeforeCursor.substring(lastAtIndex)))) {
                // We're in mention mode
                const searchText = textBeforeCursor.substring(lastAtIndex + 1).toLowerCase();
                mentionStartPos = lastAtIndex;
                
                // Filter room members by search text
                const matches = currentRoomMembers.filter(member => 
                    member.displayName.toLowerCase().startsWith(searchText)
                );
                
                if (matches.length > 0) {
                    showMentionAutocomplete(matches);
                    mentionAutocompleteActive = true;
                    selectedMentionIndex = 0;
                } else {
                    hideMentionAutocomplete();
                }
            } else {
                hideMentionAutocomplete();
            }
        }

        function handleMentionKeydown(event) {
            if (!mentionAutocompleteActive) return;
            
            const autocomplete = document.getElementById('mentionAutocomplete');
            const options = autocomplete.querySelectorAll('.mention-option');
            
            if (event.key === 'ArrowDown') {
                event.preventDefault();
                selectedMentionIndex = Math.min(selectedMentionIndex + 1, options.length - 1);
                updateMentionSelection(options);
            } else if (event.key === 'ArrowUp') {
                event.preventDefault();
                selectedMentionIndex = Math.max(selectedMentionIndex - 1, 0);
                updateMentionSelection(options);
            } else if (event.key === 'Enter' || event.key === 'Tab') {
                if (options.length > 0) {
                    event.preventDefault();
                    selectMention(options[selectedMentionIndex].dataset.username);
                }
            } else if (event.key === 'Escape') {
                hideMentionAutocomplete();
            }
        }

        function showMentionAutocomplete(members) {
            const autocomplete = document.getElementById('mentionAutocomplete');
            autocomplete.innerHTML = '';
            
            members.slice(0, 5).forEach((member, index) => {
                const option = document.createElement('div');
                option.className = 'mention-option';
                if (index === selectedMentionIndex) option.classList.add('selected');
                option.dataset.username = member.displayName;
                
                const initial = member.displayName.substring(0, 1).toUpperCase();
                
                option.innerHTML = `
                    <div class="mention-option-avatar">${initial}</div>
                    <div class="mention-option-name">${escapeHtml(member.displayName)}</div>
                `;
                
                option.onclick = () => selectMention(member.displayName);
                autocomplete.appendChild(option);
            });
            
            autocomplete.classList.add('show');
        }

        function updateMentionSelection(options) {
            options.forEach((opt, idx) => {
                if (idx === selectedMentionIndex) {
                    opt.classList.add('selected');
                } else {
                    opt.classList.remove('selected');
                }
            });
        }

        function selectMention(username) {
            const input = document.getElementById('messageInput');
            const value = input.value;
            
            // Replace from @ to cursor with the mention
            const beforeMention = value.substring(0, mentionStartPos);
            const afterCursor = value.substring(input.selectionStart);
            
            input.value = beforeMention + `@${username} ` + afterCursor;
            input.focus();
            
            const newCursorPos = beforeMention.length + username.length + 2;
            input.setSelectionRange(newCursorPos, newCursorPos);
            
            hideMentionAutocomplete();
        }

        function hideMentionAutocomplete() {
            mentionAutocompleteActive = false;
            mentionStartPos = -1;
            selectedMentionIndex = 0;
            document.getElementById('mentionAutocomplete').classList.remove('show');
        }

        // Room creation and joining
        function showCreateRoomModal() {
            const modal = new bootstrap.Modal(document.getElementById('createRoomModal'));
            modal.show();
        }

        async function createRoom() {
            const name = document.getElementById('createRoomName').value;
            const topic = document.getElementById('createRoomTopic').value;

            try {
                const response = await fetch('/_matrix/client/r0/createRoom', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, topic })
                });

                if (response.ok) {
                    const data = await response.json();
                    bootstrap.Modal.getInstance(document.getElementById('createRoomModal')).hide();
                    await loadRooms();
                    selectRoom(data.room_id);
                }
            } catch (error) {
                console.error('Error creating room:', error);
            }
        }

        async function showJoinRoomModal() {
            try {
                const response = await fetch('/api/rooms');
                if (response.ok) {
                    const data = await response.json();
                    const select = document.getElementById('availableRoomsList');
                    select.innerHTML = '';

                    data.rooms.forEach(room => {
                        if (!joinedRooms.includes(room.room_id)) {
                            const option = document.createElement('option');
                            option.value = room.room_id;
                            option.textContent = `${room.name} (${room.member_count} members)`;
                            select.appendChild(option);
                        }
                    });

                    const modal = new bootstrap.Modal(document.getElementById('joinRoomModal'));
                    modal.show();
                }
            } catch (error) {
                console.error('Error loading available rooms:', error);
            }
        }

        async function joinRoom() {
            const select = document.getElementById('availableRoomsList');
            const roomId = select.value;

            if (!roomId) return;

            try {
                const response = await fetch(`/_matrix/client/r0/rooms/${roomId}/join`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

                if (response.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('joinRoomModal')).hide();
                    await loadRooms();
                    selectRoom(roomId);
                }
            } catch (error) {
                console.error('Error joining room:', error);
            }
        }

        async function leaveRoom(roomId) {
            if (!confirm('Are you sure you want to leave this room?')) {
                return;
            }

            try {
                const response = await fetch(`/_matrix/client/r0/rooms/${roomId}/leave`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

                if (response.ok) {
                    // If we're leaving the current room, clear the view
                    if (roomId === currentRoomId) {
                        // Leave voice if active
                        if (inVoiceChannel) {
                            await leaveVoice();
                        }
                        
                        currentRoomId = null;
                        document.getElementById('currentRoomName').textContent = 'Select a room';
                        document.getElementById('currentRoomTopic').textContent = '';
                        document.getElementById('messagesContainer').innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">💬</div>
                                <p>Select a room to start chatting</p>
                            </div>
                        `;
                        document.getElementById('membersList').innerHTML = '';
                        document.getElementById('voiceMembersContainer').innerHTML = '';
                        document.getElementById('voiceMembersList').classList.remove('active');
                    }
                    
                    await loadRooms();
                }
            } catch (error) {
                console.error('Error leaving room:', error);
                alert('Failed to leave room');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
