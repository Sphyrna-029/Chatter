        function getScreenTrackMetrics(track) {
            const settings = track && track.getSettings ? track.getSettings() : {};
            const width = Number(settings.width || 0);
            const height = Number(settings.height || 0);
            const frameRate = Number(settings.frameRate || 0);
            const shortSide = Math.min(width, height);
            const longSide = Math.max(width, height);
            return { width, height, frameRate, shortSide, longSide };
        }

        function isScreenQualityNearTarget(track, measuredFps) {
            const metrics = getScreenTrackMetrics(track);
            const fps = Number(measuredFps || metrics.frameRate || 0);
            // Informational only — never gates or stops the stream
            return (
                metrics.longSide >= SCREEN_TARGET_WIDTH * 0.5 &&
                fps >= SCREEN_TARGET_FPS * 0.5
            );
        }

        function stopScreenPublisherQualityMonitor() {
            if (screenPublisherQualityTimer) {
                clearInterval(screenPublisherQualityTimer);
                screenPublisherQualityTimer = null;
            }
        }

        function startScreenPublisherQualityMonitor(sender, screenTrack) {
            stopScreenPublisherQualityMonitor();

            let previousFramesSent = null;
            let previousBytesSent = null;
            let previousTimestampMs = null;

            screenPublisherQualityTimer = setInterval(async () => {
                if (!isScreenSharing || !screenPublisherPc || !screenTrack || screenTrack.readyState !== 'live') {
                    stopScreenPublisherQualityMonitor();
                    return;
                }

                let measuredFps = null;
                let measuredBitrateMbps = null;
                let measuredRttMs = null;
                try {
                    const stats = await sender.getStats();
                    stats.forEach((stat) => {
                        if (stat.type === 'outbound-rtp' && stat.kind === 'video' && !stat.isRemote) {
                            if (typeof stat.framesPerSecond === 'number') {
                                measuredFps = stat.framesPerSecond;
                            }

                            if (typeof stat.framesSent === 'number' && typeof stat.timestamp === 'number') {
                                if (previousFramesSent !== null && previousTimestampMs !== null) {
                                    const framesDelta = stat.framesSent - previousFramesSent;
                                    const secondsDelta = (stat.timestamp - previousTimestampMs) / 1000;
                                    if (secondsDelta > 0) {
                                        if (measuredFps === null) {
                                            measuredFps = framesDelta / secondsDelta;
                                        }
                                        if (typeof stat.bytesSent === 'number' && previousBytesSent !== null) {
                                            const bytesDelta = stat.bytesSent - previousBytesSent;
                                            measuredBitrateMbps = (bytesDelta * 8) / secondsDelta / 1_000_000;
                                        }
                                    }
                                }
                                previousFramesSent = stat.framesSent;
                                previousTimestampMs = stat.timestamp;
                                if (typeof stat.bytesSent === 'number') {
                                    previousBytesSent = stat.bytesSent;
                                }
                            }
                        } else if (stat.type === 'remote-inbound-rtp' && stat.kind === 'video' && typeof stat.roundTripTime === 'number') {
                            measuredRttMs = stat.roundTripTime * 1000;
                        }
                    });
                } catch (error) {
                    console.warn('Screen quality monitor stats failed:', error);
                }

                const nearTarget = isScreenQualityNearTarget(screenTrack, measuredFps);
                const metrics = getScreenTrackMetrics(screenTrack);
                const publisherSnapshot = {
                    width: metrics.width,
                    height: metrics.height,
                    fps: Number(measuredFps || metrics.frameRate || 0),
                    bitrateMbps: measuredBitrateMbps,
                    rttMs: measuredRttMs,
                    meetsThreshold: nearTarget
                };
                setScreenPublisherTelemetry(publisherSnapshot);
                console.debug('screen-publisher-telemetry', {
                    ...publisherSnapshot,
                    fps: formatTelemetryNumber(publisherSnapshot.fps, 2),
                    bitrateMbps: formatTelemetryNumber(publisherSnapshot.bitrateMbps, 2),
                    rttMs: formatTelemetryNumber(publisherSnapshot.rttMs, 2)
                });
            }, SCREEN_QUALITY_SAMPLE_MS);
        }

        function stopScreenSubscriberTelemetry(sharerUserId) {
            const timer = screenSubscriberTelemetryTimers.get(sharerUserId);
            if (timer) {
                clearInterval(timer);
                screenSubscriberTelemetryTimers.delete(sharerUserId);
            }
            clearScreenSubscriberTelemetry(sharerUserId);
        }

        function stopAllScreenSubscriberTelemetry() {
            screenSubscriberTelemetryTimers.forEach(timer => clearInterval(timer));
            screenSubscriberTelemetryTimers.clear();
            clearAllScreenSubscriberTelemetry();
        }

        function startScreenSubscriberTelemetry(sharerUserId, pc) {
            stopScreenSubscriberTelemetry(sharerUserId);

            let previousFramesDecoded = null;
            let previousBytesReceived = null;
            let previousTimestampMs = null;
            const timer = setInterval(async () => {
                if (!pc || ['closed', 'failed'].includes(pc.connectionState)) {
                    stopScreenSubscriberTelemetry(sharerUserId);
                    return;
                }

                try {
                    const stats = await pc.getStats();
                    let inboundVideo = null;
                    let selectedPair = null;
                    let selectedPairId = null;
                    let localCandidate = null;
                    let remoteCandidate = null;

                    stats.forEach((stat) => {
                        if (stat.type === 'transport' && stat.selectedCandidatePairId) {
                            selectedPairId = stat.selectedCandidatePairId;
                        }
                    });

                    stats.forEach((stat) => {
                        if (stat.type === 'inbound-rtp' && stat.kind === 'video' && !stat.isRemote) {
                            inboundVideo = stat;
                        }

                        if (stat.type === 'candidate-pair') {
                            if (
                                (selectedPairId && stat.id === selectedPairId) ||
                                stat.selected === true ||
                                (stat.nominated && stat.state === 'succeeded')
                            ) {
                                selectedPair = stat;
                            }
                        }
                    });

                    if (selectedPair) {
                        stats.forEach((stat) => {
                            if (selectedPair.localCandidateId && stat.id === selectedPair.localCandidateId) {
                                localCandidate = stat;
                            } else if (selectedPair.remoteCandidateId && stat.id === selectedPair.remoteCandidateId) {
                                remoteCandidate = stat;
                            }
                        });
                    }

                    if (!inboundVideo) return;

                    let fps = typeof inboundVideo.framesPerSecond === 'number'
                        ? inboundVideo.framesPerSecond
                        : null;
                    let bitrateMbps = null;

                    if (typeof inboundVideo.timestamp === 'number') {
                        if (typeof inboundVideo.framesDecoded === 'number') {
                            if (previousFramesDecoded !== null && previousTimestampMs !== null) {
                                const framesDelta = inboundVideo.framesDecoded - previousFramesDecoded;
                                const secondsDelta = (inboundVideo.timestamp - previousTimestampMs) / 1000;
                                if (secondsDelta > 0 && fps === null) {
                                    fps = framesDelta / secondsDelta;
                                }
                            }
                            previousFramesDecoded = inboundVideo.framesDecoded;
                        }

                        if (typeof inboundVideo.bytesReceived === 'number') {
                            if (previousBytesReceived !== null && previousTimestampMs !== null) {
                                const bytesDelta = inboundVideo.bytesReceived - previousBytesReceived;
                                const secondsDelta = (inboundVideo.timestamp - previousTimestampMs) / 1000;
                                if (secondsDelta > 0) {
                                    bitrateMbps = (bytesDelta * 8) / secondsDelta / 1_000_000;
                                }
                            }
                            previousBytesReceived = inboundVideo.bytesReceived;
                        }

                        previousTimestampMs = inboundVideo.timestamp;
                    }

                    const jitterBufferAvgMs =
                        typeof inboundVideo.jitterBufferDelay === 'number' &&
                        typeof inboundVideo.jitterBufferEmittedCount === 'number' &&
                        inboundVideo.jitterBufferEmittedCount > 0
                            ? (inboundVideo.jitterBufferDelay / inboundVideo.jitterBufferEmittedCount) * 1000
                            : 0;

                    const rttMs =
                        selectedPair && typeof selectedPair.currentRoundTripTime === 'number'
                            ? selectedPair.currentRoundTripTime * 1000
                            : null;

                    const estimatedLatencyMs = rttMs !== null
                        ? jitterBufferAvgMs + (rttMs / 2)
                        : jitterBufferAvgMs;

                    const transport = [
                        localCandidate?.protocol || '',
                        localCandidate?.candidateType || '',
                        remoteCandidate?.candidateType || ''
                    ].filter(Boolean).join('/');

                    const subscriberSnapshot = {
                        fps: fps !== null ? Number(fps) : null,
                        bitrateMbps,
                        jitterBufferMs: jitterBufferAvgMs,
                        rttMs,
                        estimatedLatencyMs,
                        packetsLost: inboundVideo.packetsLost ?? null,
                        transport: transport || null
                    };
                    setScreenSubscriberTelemetry(sharerUserId, subscriberSnapshot);

                    console.debug('screen-subscriber-telemetry', {
                        sharerUserId,
                        fps: formatTelemetryNumber(subscriberSnapshot.fps, 2),
                        bitrateMbps: formatTelemetryNumber(subscriberSnapshot.bitrateMbps, 2),
                        jitterBufferMs: formatTelemetryNumber(subscriberSnapshot.jitterBufferMs, 2),
                        rttMs: formatTelemetryNumber(subscriberSnapshot.rttMs, 2),
                        estimatedLatencyMs: formatTelemetryNumber(subscriberSnapshot.estimatedLatencyMs, 2),
                        packetsLost: subscriberSnapshot.packetsLost ?? 'n/a',
                        transport: subscriberSnapshot.transport || 'unknown'
                    });
                } catch (error) {
                    console.warn(`Screen telemetry read failed for ${sharerUserId}:`, error);
                }
            }, SCREEN_TELEMETRY_SAMPLE_MS);

            screenSubscriberTelemetryTimers.set(sharerUserId, timer);
        }

        async function closeScreenPublisherPeer() {
            stopScreenPublisherQualityMonitor();
            clearScreenPublisherTelemetry();
            if (screenPublisherPc) {
                try {
                    await screenPublisherPc.close();
                } catch (error) {
                    console.error('Error closing screen publisher peer:', error);
                }
                screenPublisherPc = null;
            }
        }

        async function closeScreenSubscriberPeer(sharerUserId, sendUnsubscribe = true) {
            cancelScreenSubscriptionRetry(sharerUserId);
            pendingScreenSubscriptions.delete(sharerUserId);
            stopScreenSubscriberTelemetry(sharerUserId);

            const pc = screenSubscriberPcs.get(sharerUserId);
            if (pc) {
                screenSubscriberPcs.delete(sharerUserId);
                try {
                    await pc.close();
                } catch (error) {
                    console.error('Error closing screen subscriber peer:', error);
                }
            }

            incomingScreenStreams.delete(sharerUserId);

            if (sendUnsubscribe && canSignalOverWebSocket() && currentRoomId) {
                ws.send(JSON.stringify({
                    type: 'screen_webrtc_unsubscribe',
                    room_id: currentRoomId,
                    sharer_user_id: sharerUserId
                }));
            }
        }

        async function closeAllScreenSubscriberPeers(sendUnsubscribe = true) {
            const sharers = Array.from(screenSubscriberPcs.keys());
            for (const sharerUserId of sharers) {
                await closeScreenSubscriberPeer(sharerUserId, sendUnsubscribe);
            }
        }

        async function syncScreenSubscriptions() {
            if (!inVoiceChannel || !currentRoomId) {
                await closeAllScreenSubscriberPeers(false);
                return;
            }

            for (const sharerUserId of Array.from(activeScreenSharers)) {
                if (sharerUserId !== userId) {
                    await ensureScreenSubscriber(sharerUserId);
                }
            }

            for (const sharerUserId of Array.from(screenSubscriberPcs.keys())) {
                if (sharerUserId === userId || !activeScreenSharers.has(sharerUserId)) {
                    await closeScreenSubscriberPeer(sharerUserId);
                }
            }
        }

        async function ensureScreenSubscriber(sharerUserId) {
            if (!inVoiceChannel || !currentRoomId || sharerUserId === userId) return;
            if (!activeScreenSharers.has(sharerUserId)) return;
            if (screenSubscriberPcs.has(sharerUserId) || pendingScreenSubscriptions.has(sharerUserId)) return;

            if (!canSignalOverWebSocket()) {
                scheduleScreenSubscriptionRetry(sharerUserId);
                return;
            }

            const pc = new RTCPeerConnection(WEBRTC_CONFIG);
            screenSubscriberPcs.set(sharerUserId, pc);
            pendingScreenSubscriptions.add(sharerUserId);
            startScreenSubscriberTelemetry(sharerUserId, pc);

            pc.onicecandidate = (event) => {
                if (!event.candidate || !canSignalOverWebSocket()) return;
                ws.send(JSON.stringify({
                    type: 'screen_webrtc_subscribe_candidate',
                    room_id: currentRoomId,
                    sharer_user_id: sharerUserId,
                    candidate: event.candidate.toJSON()
                }));
            };

            pc.ontrack = (event) => {
                const incomingStream = event.streams && event.streams[0]
                    ? event.streams[0]
                    : new MediaStream([event.track]);

                // Minimize jitter buffer to reduce playout delay for near-realtime viewing
                if (event.receiver && typeof event.receiver.jitterBufferTarget !== 'undefined') {
                    // Target minimal jitter buffer (in seconds) — browser clamps to safe minimum
                    event.receiver.jitterBufferTarget = 0;
                }
                if (event.receiver && event.receiver.playoutDelayHint !== undefined) {
                    event.receiver.playoutDelayHint = 0;
                }

                incomingScreenStreams.set(sharerUserId, incomingStream);
                displayScreenShare(incomingStream, sharerUserId);
            };

            pc.onconnectionstatechange = () => {
                if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) {
                    closeScreenSubscriberPeer(sharerUserId, false);
                    if (inVoiceChannel && activeScreenSharers.has(sharerUserId)) {
                        scheduleScreenSubscriptionRetry(sharerUserId);
                    }
                }
            };

            try {
                pc.addTransceiver('video', { direction: 'recvonly' });
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                if (!canSignalOverWebSocket()) {
                    throw new Error('WebSocket disconnected before subscribe offer could be sent');
                }

                ws.send(JSON.stringify({
                    type: 'screen_webrtc_subscribe_offer',
                    room_id: currentRoomId,
                    sharer_user_id: sharerUserId,
                    sdp: offer.sdp
                }));
            } catch (error) {
                console.error(`Failed creating subscribe peer for ${sharerUserId}:`, error);
                await closeScreenSubscriberPeer(sharerUserId, false);
                if (inVoiceChannel && activeScreenSharers.has(sharerUserId)) {
                    scheduleScreenSubscriptionRetry(sharerUserId);
                }
            }
        }

        async function startScreenPublisherPeer() {
            if (!screenStream) {
                throw new Error('Missing screen stream');
            }

            if (!canSignalOverWebSocket()) {
                throw new Error('WebSocket is not connected');
            }

            await closeScreenPublisherPeer();

            const pc = new RTCPeerConnection(WEBRTC_CONFIG);
            screenPublisherPc = pc;

            const screenTrack = screenStream.getVideoTracks()[0];
            if (!screenTrack) {
                throw new Error('No screen video track available');
            }

            if ('contentHint' in screenTrack) {
                screenTrack.contentHint = 'detail';
            }

            const sender = pc.addTrack(screenTrack, screenStream);
            try {
                const params = sender.getParameters() || {};
                const encodings = (params.encodings && params.encodings.length > 0)
                    ? params.encodings
                    : [{}];
                params.encodings = encodings.map(encoding => ({
                    ...encoding,
                    scaleResolutionDownBy: 1.0
                }));
                // Let WebRTC congestion control adapt bitrate/framerate freely
                params.degradationPreference = 'balanced';
                await sender.setParameters(params);
            } catch (error) {
                console.warn('Unable to apply screen sender parameters:', error);
            }
            startScreenPublisherQualityMonitor(sender, screenTrack);

            pc.onicecandidate = (event) => {
                if (!event.candidate || !canSignalOverWebSocket()) return;
                ws.send(JSON.stringify({
                    type: 'screen_webrtc_publish_candidate',
                    room_id: currentRoomId,
                    candidate: event.candidate.toJSON()
                }));
            };

            pc.onconnectionstatechange = () => {
                if (['failed', 'disconnected', 'closed'].includes(pc.connectionState) && isScreenSharing) {
                    stopScreenShare();
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            ws.send(JSON.stringify({
                type: 'screen_webrtc_publish_offer',
                room_id: currentRoomId,
                sdp: offer.sdp
            }));
        }

        async function startScreenShare() {
            try {
                // Get screen stream
                screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        cursor: 'always',
                        displaySurface: 'monitor',
                        width: { ideal: SCREEN_TARGET_WIDTH },
                        height: { ideal: SCREEN_TARGET_HEIGHT },
                        frameRate: { ideal: SCREEN_TARGET_FPS }
                    },
                    audio: false
                });

                const screenTrack = screenStream.getVideoTracks()[0];
                if (!screenTrack) {
                    throw new Error('No screen track received from browser');
                }

                if ('contentHint' in screenTrack) {
                    screenTrack.contentHint = 'detail';
                }

                try {
                    await screenTrack.applyConstraints({
                        width: { ideal: SCREEN_TARGET_WIDTH },
                        height: { ideal: SCREEN_TARGET_HEIGHT },
                        frameRate: { ideal: SCREEN_TARGET_FPS }
                    });
                } catch (error) {
                    console.warn('Unable to enforce screen capture constraints:', error);
                }

                // Log initial track quality (FPS may read as 0 until frames start flowing)
                const initialMetrics = getScreenTrackMetrics(screenTrack);
                console.info(`Screen capture started: ${initialMetrics.width}x${initialMetrics.height} @ ${initialMetrics.frameRate}fps`);

                isScreenSharing = true;

                // Update UI
                document.getElementById('screenShareBtn').textContent = '🖥️ Stop Sharing';
                document.getElementById('screenShareBtn').classList.add('active');

                // Notify server
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'screen_share_start',
                        room_id: currentRoomId
                    }));
                }

                // Handle stream end (user clicks browser's stop sharing button)
                screenTrack.onended = () => {
                    stopScreenShare();
                };

                // Publish screen via WebRTC to the server SFU
                await startScreenPublisherPeer();

            } catch (error) {
                console.error('Error starting screen share:', error);
                await closeScreenPublisherPeer();
                if (screenStream) {
                    screenStream.getTracks().forEach(track => {
                        track.onended = null;
                        track.stop();
                    });
                    screenStream = null;
                }
                isScreenSharing = false;
                document.getElementById('screenShareBtn').textContent = '🖥️ Share Screen';
                document.getElementById('screenShareBtn').classList.remove('active');
                if (canSignalOverWebSocket() && currentRoomId) {
                    ws.send(JSON.stringify({
                        type: 'screen_share_stop',
                        room_id: currentRoomId
                    }));
                }
                const errorMsg = error.name === 'NotAllowedError'
                    ? 'Screen sharing was denied. Please check permissions.'
                    : `Could not start screen sharing: ${error.message}`;
                alert(errorMsg);
            }
        }

        async function stopScreenShare() {
            const wasScreenSharing = isScreenSharing;
            isScreenSharing = false;

            await closeScreenPublisherPeer();

            if (screenStream) {
                screenStream.getTracks().forEach(track => {
                    track.onended = null;
                    track.stop();
                });
                screenStream = null;
            }

            // Update UI
            document.getElementById('screenShareBtn').textContent = '🖥️ Share Screen';
            document.getElementById('screenShareBtn').classList.remove('active');

            // Notify server
            if (wasScreenSharing && canSignalOverWebSocket() && currentRoomId) {
                ws.send(JSON.stringify({
                    type: 'screen_share_stop',
                    room_id: currentRoomId
                }));
            }
        }

        function displayScreenShare(stream, sharerUserId) {
            activeScreenSharers.add(sharerUserId);
            incomingScreenStreams.set(sharerUserId, stream);
            const wrapper = document.getElementById('screenShareWrapper');
            
            // Auto-select first screen share if none selected
            if (!selectedScreenShare && activeScreenSharers.size === 1) {
                selectedScreenShare = sharerUserId;
            }

            // Create main container if it doesn't exist
            let mainContainer = document.getElementById('screenShareMain');
            if (!mainContainer) {
                mainContainer = document.createElement('div');
                mainContainer.id = 'screenShareMain';
                mainContainer.className = 'screen-share-main';
                mainContainer.style.display = 'none';
                mainContainer.innerHTML = `
                    <div class="screen-share-main-header">
                        <h4 class="screen-share-main-title" id="screenShareMainTitle"></h4>
                    </div>
                    <video class="screen-share-main-video" id="screenShareMainVideo" autoplay playsinline muted></video>
                `;
                wrapper.insertBefore(mainContainer, wrapper.firstChild);
            }

            // Create preview grid container if it doesn't exist
            let gridContainer = document.getElementById('screenShareGrid');
            if (!gridContainer) {
                gridContainer = document.createElement('div');
                gridContainer.id = 'screenShareGrid';
                gridContainer.className = 'screen-share-grid';
                wrapper.appendChild(gridContainer);
            }

            // Create or update preview tile for this sharer
            const previewId = 'screenPreview_' + CSS.escape(sharerUserId);
            let preview = document.getElementById(previewId);
            
            if (!preview) {
                preview = document.createElement('div');
                preview.id = previewId;
                preview.className = 'screen-share-preview';
                if (sharerUserId === selectedScreenShare) {
                    preview.classList.add('selected');
                }
                
                const sharerName = sharerUserId.split(':')[0].substring(1);
                preview.innerHTML = `
                    <video class="screen-share-preview-video" autoplay playsinline muted></video>
                    <div class="screen-share-preview-label">${escapeHtml(sharerName)}</div>
                `;

                // Click handler to select this screen share
                preview.onclick = () => selectScreenShare(sharerUserId);
                
                gridContainer.appendChild(preview);
            }

            const previewVideo = preview.querySelector('video');
            if (previewVideo && previewVideo.srcObject !== stream) {
                previewVideo.srcObject = stream;
                previewVideo.play().catch(() => {});
            }

            // Update main view ONLY if this is the selected sharer
            if (sharerUserId === selectedScreenShare) {
                mainContainer.style.display = 'block';
                const mainTitle = document.getElementById('screenShareMainTitle');
                const sharerName = sharerUserId.split(':')[0].substring(1);
                mainTitle.textContent = `${sharerName}'s screen`;
                const mainVideo = document.getElementById('screenShareMainVideo');
                if (mainVideo && mainVideo.srcObject !== stream) {
                    mainVideo.srcObject = stream;
                    mainVideo.play().catch(() => {});
                }
            }
        }

        function selectScreenShare(sharerUserId) {
            // Update selection
            const previousSelection = selectedScreenShare;
            selectedScreenShare = sharerUserId;

            // Update preview tile visual states
            if (previousSelection) {
                const prevPreview = document.getElementById('screenPreview_' + CSS.escape(previousSelection));
                if (prevPreview) {
                    prevPreview.classList.remove('selected');
                }
            }

            const newPreview = document.getElementById('screenPreview_' + CSS.escape(sharerUserId));
            if (newPreview) {
                newPreview.classList.add('selected');
            }

            // Update main view
            const mainContainer = document.getElementById('screenShareMain');
            
            if (mainContainer && newPreview) {
                mainContainer.style.display = 'block';
                const mainTitle = document.getElementById('screenShareMainTitle');
                const sharerName = sharerUserId.split(':')[0].substring(1);
                mainTitle.textContent = `${sharerName}'s screen`;
                const mainVideo = document.getElementById('screenShareMainVideo');
                const stream = incomingScreenStreams.get(sharerUserId);
                if (mainVideo && stream && mainVideo.srcObject !== stream) {
                    mainVideo.srcObject = stream;
                    mainVideo.play().catch(() => {});
                }
            }
        }

        // View switching between chat and voice/screenshare
        let currentView = 'chat'; // 'chat' or 'voice'

        function switchView(view) {
            currentView = view;
            
            const chatView = document.getElementById('chatViewContainer');
            const voiceView = document.getElementById('voiceViewContainer');
            const tabs = document.querySelectorAll('.view-toggle-tab');
            
            if (view === 'chat') {
                chatView.classList.remove('hidden');
                voiceView.classList.add('hidden');
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                chatView.classList.add('hidden');
                voiceView.classList.remove('hidden');
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
                
                // Update voice members in the voice view
                syncVoiceMembersToAltView();
            }
        }

        function syncVoiceMembersToAltView() {
            // Copy voice members list to the alternate view
            const source = document.getElementById('voiceMembersContainer');
            const dest = document.getElementById('voiceMembersContainerAlt');
            if (source && dest) {
                dest.innerHTML = source.innerHTML;
            }
        }

        async function hideScreenShare(sharerUserId) {
            if (sharerUserId) {
                activeScreenSharers.delete(sharerUserId);
                cancelScreenSubscriptionRetry(sharerUserId);
                pendingScreenSubscriptions.delete(sharerUserId);
                await closeScreenSubscriberPeer(sharerUserId);
                incomingScreenStreams.delete(sharerUserId);
                
                // Remove preview tile
                const previewId = 'screenPreview_' + CSS.escape(sharerUserId);
                const preview = document.getElementById(previewId);
                if (preview) {
                    const video = preview.querySelector('video');
                    if (video && video.srcObject) {
                        video.srcObject = null;
                    }
                    preview.remove();
                }

                // If this was the selected screen share, select another or hide main view
                if (selectedScreenShare === sharerUserId) {
                    const remaining = Array.from(activeScreenSharers);
                    if (remaining.length > 0) {
                        // Auto-select the first remaining screen share
                        selectScreenShare(remaining[0]);
                    } else {
                        // No more screen shares, hide main view
                        selectedScreenShare = null;
                        const mainContainer = document.getElementById('screenShareMain');
                        if (mainContainer) {
                            mainContainer.style.display = 'none';
                            const mainVideo = document.getElementById('screenShareMainVideo');
                            if (mainVideo) {
                                mainVideo.srcObject = null;
                            }
                        }
                    }
                }

                // Clean up grid and main containers if no screen shares remain
                if (activeScreenSharers.size === 0) {
                    const gridContainer = document.getElementById('screenShareGrid');
                    if (gridContainer) {
                        gridContainer.remove();
                    }
                    const mainContainer = document.getElementById('screenShareMain');
                    if (mainContainer) {
                        mainContainer.remove();
                    }
                }
            } else {
                // Hide all screen shares
                activeScreenSharers.clear();
                selectedScreenShare = null;
                clearAllScreenSubscriptionRetries();
                pendingScreenSubscriptions.clear();
                incomingScreenStreams.clear();
                await closeAllScreenSubscriberPeers();
                
                // Clean up all preview videos
                const gridContainer = document.getElementById('screenShareGrid');
                if (gridContainer) {
                    gridContainer.querySelectorAll('video').forEach(video => {
                        if (video.srcObject) {
                            video.srcObject = null;
                        }
                    });
                    gridContainer.remove();
                }

                // Clean up main view
                const mainContainer = document.getElementById('screenShareMain');
                if (mainContainer) {
                    const mainVideo = document.getElementById('screenShareMainVideo');
                    if (mainVideo) {
                        mainVideo.srcObject = null;
                    }
                    mainContainer.remove();
                }
            }
        }

        async function joinVoice() {
            try {
                // Request microphone access
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 48000
                    }, 
                    video: false 
                });

                inVoiceChannel = true;
                
                // Update UI
                document.getElementById('voiceBtn').textContent = '🔇 Leave Voice';
                document.getElementById('voiceBtn').classList.add('active');
                if (voiceInputMode === 'open') {
                    document.getElementById('muteBtn').classList.add('visible');
                }
                document.getElementById('pttToggleBtn').classList.add('visible');
                document.getElementById('screenShareBtn').classList.add('visible');
                document.getElementById('voiceIndicator').classList.add('active');
                document.getElementById('voiceMembersList').classList.add('active');

                // If in PTT mode, start muted
                if (voiceInputMode === 'ptt') {
                    setMicEnabled(false);
                }

                // Notify server via JSON message (triggers voice_webrtc_publishers_list response)
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'voice_join',
                        room_id: currentRoomId
                    }));
                }

                // Create publisher peer connection to send our audio to server
                await createVoicePublisher();

                // Load current voice members
                await loadVoiceMembers();

            } catch (error) {
                console.error('Error accessing microphone:', error);
                alert('Could not access microphone. Please check permissions.');
            }
        }

        async function createVoicePublisher() {
            if (!localStream || !canSignalOverWebSocket()) return;

            await closeVoicePublisher();

            const pc = new RTCPeerConnection(WEBRTC_CONFIG);
            voicePublisherPc = pc;

            // Add audio track
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                pc.addTrack(audioTrack, localStream);
            }

            pc.onicecandidate = (event) => {
                if (!event.candidate || !canSignalOverWebSocket()) return;
                ws.send(JSON.stringify({
                    type: 'voice_webrtc_publish_candidate',
                    room_id: currentRoomId,
                    candidate: {
                        candidate: event.candidate.candidate,
                        sdpMid: event.candidate.sdpMid,
                        sdpMLineIndex: event.candidate.sdpMLineIndex,
                        usernameFragment: event.candidate.usernameFragment
                    }
                }));
            };

            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
                    console.warn('Voice publisher PC state:', pc.connectionState);
                }
            };

            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                ws.send(JSON.stringify({
                    type: 'voice_webrtc_publish_offer',
                    room_id: currentRoomId,
                    sdp: offer.sdp
                }));
            } catch (error) {
                console.error('Failed to create voice publisher offer:', error);
                await closeVoicePublisher();
            }
        }

        async function closeVoicePublisher() {
            if (voicePublisherPc) {
                const pc = voicePublisherPc;
                voicePublisherPc = null;
                try { pc.close(); } catch (e) {}
            }
        }

        async function createVoiceSubscriber(speakerUserId) {
            if (speakerUserId === userId) return;
            if (!inVoiceChannel || !canSignalOverWebSocket()) return;
            if (voiceSubscriberPcs.has(speakerUserId) || pendingVoiceSubscriptions.has(speakerUserId)) return;

            const pc = new RTCPeerConnection(WEBRTC_CONFIG);
            voiceSubscriberPcs.set(speakerUserId, pc);
            pendingVoiceSubscriptions.add(speakerUserId);

            pc.onicecandidate = (event) => {
                if (!event.candidate || !canSignalOverWebSocket()) return;
                ws.send(JSON.stringify({
                    type: 'voice_webrtc_subscribe_candidate',
                    room_id: currentRoomId,
                    speaker_user_id: speakerUserId,
                    candidate: {
                        candidate: event.candidate.candidate,
                        sdpMid: event.candidate.sdpMid,
                        sdpMLineIndex: event.candidate.sdpMLineIndex,
                        usernameFragment: event.candidate.usernameFragment
                    }
                }));
            };

            pc.ontrack = (event) => {
                // Create an audio element for this speaker
                let audioEl = voiceAudioElements.get(speakerUserId);
                if (!audioEl) {
                    audioEl = new Audio();
                    audioEl.autoplay = true;
                    audioEl.playsInline = true;
                    voiceAudioElements.set(speakerUserId, audioEl);
                }
                audioEl.srcObject = event.streams[0] || new MediaStream([event.track]);
                audioEl.volume = voiceUserVolumes[speakerUserId] ?? 1.0;
                audioEl.play().catch(e => console.warn('Audio play failed:', e));
            };

            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
                    closeVoiceSubscriber(speakerUserId);
                }
            };

            // Need to add a recvonly transceiver to get audio from the server
            pc.addTransceiver('audio', { direction: 'recvonly' });

            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                ws.send(JSON.stringify({
                    type: 'voice_webrtc_subscribe_offer',
                    room_id: currentRoomId,
                    speaker_user_id: speakerUserId,
                    sdp: offer.sdp
                }));
            } catch (error) {
                console.error(`Failed to create voice subscriber offer for ${speakerUserId}:`, error);
                closeVoiceSubscriber(speakerUserId);
                scheduleVoiceSubscriptionRetry(speakerUserId);
            }
        }

        function closeVoiceSubscriber(speakerUserId) {
            pendingVoiceSubscriptions.delete(speakerUserId);
            cancelVoiceSubscriptionRetry(speakerUserId);

            const pc = voiceSubscriberPcs.get(speakerUserId);
            if (pc) {
                voiceSubscriberPcs.delete(speakerUserId);
                try { pc.close(); } catch (e) {}
            }

            const audioEl = voiceAudioElements.get(speakerUserId);
            if (audioEl) {
                audioEl.srcObject = null;
                voiceAudioElements.delete(speakerUserId);
            }
        }

        function closeAllVoiceSubscribers() {
            const speakers = Array.from(voiceSubscriberPcs.keys());
            for (const speakerUserId of speakers) {
                closeVoiceSubscriber(speakerUserId);
            }
        }

        function scheduleVoiceSubscriptionRetry(speakerUserId) {
            cancelVoiceSubscriptionRetry(speakerUserId);
            const timer = setTimeout(() => {
                voiceSubscriptionRetryTimers.delete(speakerUserId);
                if (inVoiceChannel && voiceMembers.has(speakerUserId)) {
                    createVoiceSubscriber(speakerUserId);
                }
            }, VOICE_SUBSCRIBE_RETRY_MS);
            voiceSubscriptionRetryTimers.set(speakerUserId, timer);
        }

        function cancelVoiceSubscriptionRetry(speakerUserId) {
            const timer = voiceSubscriptionRetryTimers.get(speakerUserId);
            if (timer) {
                clearTimeout(timer);
                voiceSubscriptionRetryTimers.delete(speakerUserId);
            }
        }

        function clearAllVoiceSubscriptionRetries() {
            for (const timer of voiceSubscriptionRetryTimers.values()) {
                clearTimeout(timer);
            }
            voiceSubscriptionRetryTimers.clear();
        }

        async function leaveVoice() {
            // Stop screen sharing if active
            if (isScreenSharing) {
                await stopScreenShare();
            }

            // Hide all incoming screen shares
            await hideScreenShare();

            // Teardown voice WebRTC
            await closeVoicePublisher();
            closeAllVoiceSubscribers();
            clearAllVoiceSubscriptionRetries();

            // Stop local stream
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            inVoiceChannel = false;
            isMuted = false;

            // Reset PTT state
            pttKeyHeld = false;

            // Update UI
            document.getElementById('voiceBtn').textContent = '🔊 Join Voice';
            document.getElementById('voiceBtn').classList.remove('active');
            document.getElementById('muteBtn').classList.remove('visible', 'muted');
            document.getElementById('muteBtn').textContent = '🎤 Mute';
            document.getElementById('pttToggleBtn').classList.remove('visible');
            document.getElementById('pttActiveIndicator').classList.remove('active');
            document.getElementById('screenShareBtn').classList.remove('visible', 'active');
            document.getElementById('voiceIndicator').classList.remove('active');
            document.getElementById('viewToggleTabs').classList.remove('active');
            
            // Switch back to chat view when leaving voice
            if (currentView === 'voice') {
                switchView('chat');
            }
            
            // Don't hide voice members list - let updateVoiceMembersList decide based on if anyone is in voice

            // Notify server
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'voice_leave',
                    room_id: currentRoomId
                }));
            }

            // Reload voice members to see who's still in voice
            await loadVoiceMembers();
        }

        function setMicEnabled(enabled) {
            if (!localStream) return;

            const wasMuted = isMuted;
            isMuted = !enabled;

            // Mute/unmute local audio track
            localStream.getAudioTracks().forEach(track => {
                track.enabled = enabled;
            });

            // Update mute button UI
            const muteBtn = document.getElementById('muteBtn');
            if (isMuted) {
                muteBtn.textContent = '🔇 Unmute';
                muteBtn.classList.add('muted');
            } else {
                muteBtn.textContent = '🎤 Mute';
                muteBtn.classList.remove('muted');
            }

            // Update PTT transmitting indicator
            if (voiceInputMode === 'ptt') {
                const pttIndicator = document.getElementById('pttActiveIndicator');
                if (enabled) {
                    pttIndicator.classList.add('active');
                } else {
                    pttIndicator.classList.remove('active');
                }
            }

            // Notify server only if muted state actually changed
            if (wasMuted !== isMuted && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'voice_mute',
                    room_id: currentRoomId,
                    muted: isMuted
                }));
            }

            // Update voice members list to reflect mute state
            updateVoiceMembersList();
        }

        function toggleMute() {
            if (!localStream) return;
            setMicEnabled(isMuted); // if muted, enable; if not muted, disable
        }

        function toggleInputMode() {
            if (voiceInputMode === 'open') {
                voiceInputMode = 'ptt';
                // Switching to PTT: immediately mute mic (must hold key to talk)
                setMicEnabled(false);
                // Update PTT toggle button
                const pttBtn = document.getElementById('pttToggleBtn');
                pttBtn.textContent = '🔑 Push to Talk (`)';
                pttBtn.classList.add('ptt-mode');
                // Hide mute button (PTT replaces it)
                document.getElementById('muteBtn').classList.remove('visible');
            } else {
                voiceInputMode = 'open';
                pttKeyHeld = false;
                // Switching to Open Mic: unmute mic
                setMicEnabled(true);
                // Update PTT toggle button
                const pttBtn = document.getElementById('pttToggleBtn');
                pttBtn.textContent = '🎙 Open Mic';
                pttBtn.classList.remove('ptt-mode');
                // Show mute button again
                document.getElementById('muteBtn').classList.add('visible');
                // Hide transmitting indicator
                document.getElementById('pttActiveIndicator').classList.remove('active');
            }
        }

        async function loadVoiceMembers() {
            try {
                const response = await fetch(`/api/rooms/${currentRoomId}/voice`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    voiceMembers = new Set(data.voice_members.map(m => m.user_id));
                    
                    // Update member states and rebuild active screen sharers
                    voiceMemberStates = {};
                    activeScreenSharers.clear();
                    data.voice_members.forEach(member => {
                        voiceMemberStates[member.user_id] = {
                            muted: member.muted,
                            screen_sharing: member.screen_sharing
                        };
                        // Track all active screen sharers so late joiners see their streams
                        if (member.screen_sharing && member.user_id !== userId) {
                            activeScreenSharers.add(member.user_id);
                        }
                    });

                    updateVoiceMembersList();
                    await syncScreenSubscriptions();
                }
            } catch (error) {
                console.error('Error loading voice members:', error);
            }
        }

        function updateVoiceMembersList() {
            const container = document.getElementById('voiceMembersContainer');
            const listElement = document.getElementById('voiceMembersList');
            const toggleTabs = document.getElementById('viewToggleTabs');
            container.innerHTML = '';

            // Show/hide toggle tabs based on voice channel status
            if (voiceMembers.size === 0) {
                listElement.classList.remove('active');
                toggleTabs.classList.remove('active');
                return;
            }

            // Show the voice members list and toggle tabs when someone is in voice
            listElement.classList.add('active');
            if (inVoiceChannel) {
                toggleTabs.classList.add('active');
            }

            voiceMembers.forEach(memberId => {
                const memberName = memberId.split(':')[0].substring(1);
                const isSelf = memberId === userId;
                const memberState = voiceMemberStates[memberId] || {};
                const isSharing = memberState.screen_sharing || activeScreenSharers.has(memberId);
                const isMutedMember = memberState.muted || (isSelf && isMuted);
                
                const memberDiv = document.createElement('div');
                memberDiv.className = 'voice-member-item';
                
                const sharingIndicator = isSharing ? '<span class="voice-member-sharing">📺 Sharing</span>' : '';
                const muteIcon = isMutedMember ? '🔇' : '🎤';
                const muteClass = isMutedMember ? 'voice-member-muted' : '';
                const currentVol = Math.round((voiceUserVolumes[memberId] ?? 1.0) * 100);
                const volumeSlider = !isSelf ? `
                    <input type="range" class="voice-volume-slider" min="0" max="100" value="${currentVol}"
                           oninput="setUserVolume('${memberId}', this.value)">
                    <span class="voice-volume-label" id="volLabel_${CSS.escape(memberId)}">${currentVol}%</span>
                ` : '';
                
                memberDiv.innerHTML = `
                    <span class="voice-member-icon ${muteClass}">${muteIcon}</span>
                    <span class="voice-member-name">${escapeHtml(memberName)}${isSelf ? ' (You)' : ''}</span>
                    ${volumeSlider}
                    ${sharingIndicator}
                `;
                
                container.appendChild(memberDiv);
            });

            // Sync to the alternate voice view
            syncVoiceMembersToAltView();
        }

        function setUserVolume(speakerUserId, value) {
            const normalized = value / 100;
            voiceUserVolumes[speakerUserId] = normalized;

            // Apply to audio element if it exists
            const audioEl = voiceAudioElements.get(speakerUserId);
            if (audioEl) {
                audioEl.volume = normalized;
            }

            // Update labels in both containers
            document.querySelectorAll(`[id="volLabel_${CSS.escape(speakerUserId)}"]`).forEach(label => {
                label.textContent = `${Math.round(value)}%`;
            });

            // Sync sliders to alt view
            syncVoiceMembersToAltView();
        }
