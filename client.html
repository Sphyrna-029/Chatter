<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Protocol Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-glow: #00d9ff;
            --secondary-glow: #7b2ff7;
            --bg-dark: #0a0e1a;
            --bg-card: #13182b;
            --border-color: #1e2841;
            --text-muted: #6b7c9e;
            --success-color: #00ff9d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(0, 217, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(123, 47, 247, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            color: #e4e8f0;
        }

        .app-container {
            max-width: 100%;
            margin: 0;
            padding: 20px 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            text-align: center;
            margin: 0 20px 30px 20px;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(19, 24, 43, 0.7) 100%);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }

        .app-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-glow), var(--secondary-glow), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            margin-top: 8px;
        }

        .login-card, .chat-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .login-card {
            max-width: 450px;
            margin: 0 auto;
        }

        .form-control, .form-select {
            background: rgba(10, 14, 26, 0.7);
            border: 1px solid var(--border-color);
            color: #e4e8f0;
            font-family: 'Outfit', sans-serif;
            border-radius: 8px;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            background: rgba(10, 14, 26, 0.9);
            border-color: var(--primary-glow);
            box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.1);
            color: #fff;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.4);
        }

        .btn-outline-primary {
            border: 2px solid var(--primary-glow);
            color: var(--primary-glow);
            background: transparent;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-outline-primary:hover {
            background: var(--primary-glow);
            color: var(--bg-dark);
            transform: translateY(-2px);
        }

        .chat-container {
            flex: 1;
            display: flex;
            gap: 20px;
            min-height: 0;
            padding: 0 20px;
        }

        .sidebar {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .user-info {
            background: rgba(0, 217, 255, 0.05);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .user-details {
            flex: 1;
            overflow: hidden;
        }

        .user-name {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-id {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .rooms-panel {
            flex: 1;
            background: rgba(10, 14, 26, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
        }

        .rooms-panel h5 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .room-item {
            background: rgba(19, 24, 43, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .room-item:hover {
            background: rgba(19, 24, 43, 0.9);
            border-color: var(--primary-glow);
            transform: translateX(5px);
        }

        .room-item:hover .room-leave-btn {
            opacity: 1;
        }

        .room-item.active {
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.15), rgba(123, 47, 247, 0.15));
            border-color: var(--primary-glow);
        }

        .room-mention-badge {
            position: absolute;
            top: -4px;
            left: -4px;
            width: 12px;
            height: 12px;
            background: #0066ff;
            border: 2px solid var(--bg-card);
            border-radius: 50%;
            display: none;
            animation: mentionPulse 2s infinite;
        }

        .room-mention-badge.show {
            display: block;
        }

        @keyframes mentionPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(0, 102, 255, 0.7);
            }
            50% {
                box-shadow: 0 0 0 6px rgba(0, 102, 255, 0);
            }
        }

        .room-leave-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 59, 48, 0.2);
            border: 1px solid rgba(255, 59, 48, 0.5);
            color: #ff3b30;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0;
            z-index: 10;
        }

        .room-leave-btn:hover {
            background: rgba(255, 59, 48, 0.4);
            border-color: #ff3b30;
            transform: scale(1.05);
        }

        .mention {
            background: rgba(0, 102, 255, 0.2);
            color: #0066ff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mention:hover {
            background: rgba(0, 102, 255, 0.3);
        }

        .mention-autocomplete {
            position: absolute;
            bottom: 100%;
            left: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 100;
            margin-bottom: 5px;
            max-height: 200px;
            overflow-y: auto;
            min-width: 200px;
        }

        .mention-autocomplete.show {
            display: block;
            animation: mentionSlideUp 0.2s ease;
        }

        @keyframes mentionSlideUp {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .mention-option {
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mention-option:hover, .mention-option.selected {
            background: rgba(0, 102, 255, 0.2);
        }

        .mention-option-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .mention-option-name {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .room-name {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .room-topic {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            background: rgba(10, 14, 26, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .view-toggle-tabs {
            display: none;
            gap: 8px;
            margin-top: 10px;
            width: 100%;
        }

        .view-toggle-tabs.active {
            display: flex;
        }

        .view-toggle-tab {
            flex: 1;
            padding: 8px 16px;
            background: rgba(10, 14, 26, 0.7);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .view-toggle-tab:hover {
            border-color: var(--primary-glow);
            color: var(--primary-glow);
        }

        .view-toggle-tab.active {
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border-color: transparent;
            color: white;
        }

        .chat-view-container,
        .voice-view-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .chat-view-container.hidden,
        .voice-view-container.hidden {
            display: none;
        }

        .voice-view-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-header-info {
            flex: 1;
        }

        .voice-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-voice {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-voice:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-voice.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .btn-voice.active:hover {
            box-shadow: 0 5px 20px rgba(239, 68, 68, 0.4);
        }

        .btn-screen-share {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .btn-screen-share.visible {
            display: block;
        }

        .btn-screen-share.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .btn-screen-share:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
        }

        .btn-screen-share.active:hover {
            box-shadow: 0 5px 20px rgba(239, 68, 68, 0.4);
        }

        .btn-mute {
            background: rgba(100, 100, 100, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .btn-mute.visible {
            display: block;
        }

        .btn-mute.muted {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
            color: #ef4444;
        }

        .btn-mute:hover {
            background: rgba(100, 100, 100, 0.5);
        }

        .screen-share-container {
            margin-bottom: 15px;
            background: rgba(10, 14, 26, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: none;
        }

        .screen-share-container.active {
            display: block;
        }

        .screen-share-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
            padding: 0;
        }

        .screen-share-preview {
            position: relative;
            background: rgba(10, 14, 26, 0.9);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
        }

        .screen-share-preview > * {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .screen-share-preview:hover {
            border-color: #8b5cf6;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.3);
        }

        .screen-share-preview.selected {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .screen-share-preview-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            backface-visibility: hidden;
            transform: translateZ(0);
            will-change: transform;
        }

        .screen-share-preview-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px 12px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            color: #8b5cf6;
            font-size: 0.85rem;
            font-weight: 600;
            pointer-events: none;
        }

        .screen-share-main {
            background: rgba(10, 14, 26, 0.9);
            border: 2px solid #8b5cf6;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .screen-share-main-header {
            padding: 12px 16px;
            background: rgba(139, 92, 246, 0.1);
            border-bottom: 1px solid rgba(139, 92, 246, 0.3);
        }

        .screen-share-main-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #8b5cf6;
            margin: 0;
        }

        .screen-share-main-video {
            width: 100%;
            max-height: 600px;
            background: #000;
            display: block;
            backface-visibility: hidden;
            transform: translateZ(0);
            will-change: transform;
        }

        .voice-members-list {
            padding: 10px 15px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            margin-bottom: 10px;
            display: none;
        }

        .voice-members-list.active {
            display: block;
        }

        .voice-members-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #10b981;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .voice-member-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 0.9rem;
        }

        .voice-member-icon {
            font-size: 1rem;
        }

        .voice-member-name {
            flex: 1;
        }

        .voice-member-sharing {
            color: #8b5cf6;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .voice-member-muted {
            color: #ef4444;
            font-size: 0.75rem;
        }

        .chat-title {
            font-weight: 700;
            font-size: 1.3rem;
            margin: 0;
        }

        .chat-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }

        .messages-container {
            flex: 1;
            background: rgba(10, 14, 26, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 20px;
            animation: messageSlide 0.3s ease;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .message-sender {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .message-body {
            margin-left: 42px;
            padding: 10px 15px;
            background: rgba(19, 24, 43, 0.6);
            border-radius: 8px;
            border-left: 3px solid var(--primary-glow);
            word-wrap: break-word;
            position: relative;
        }

        .message-body.deleted {
            opacity: 0.5;
            font-style: italic;
            color: var(--text-muted);
        }

        .message-actions {
            position: absolute;
            top: 5px;
            right: 5px;
            opacity: 0;
            transition: opacity 0.2s ease;
            display: flex;
            gap: 5px;
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .btn-delete, .btn-react {
            background: rgba(255, 59, 48, 0.2);
            border: 1px solid rgba(255, 59, 48, 0.5);
            color: #ff3b30;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-react {
            background: rgba(0, 217, 255, 0.2);
            border: 1px solid rgba(0, 217, 255, 0.5);
            color: var(--primary-glow);
        }

        .btn-delete:hover {
            background: rgba(255, 59, 48, 0.3);
            border-color: #ff3b30;
        }

        .btn-react:hover {
            background: rgba(0, 217, 255, 0.3);
            border-color: var(--primary-glow);
        }

        .message-reactions {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-left: 42px;
        }

        .reaction-item {
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 12px;
            padding: 4px 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .reaction-item:hover {
            background: rgba(0, 217, 255, 0.2);
            border-color: var(--primary-glow);
            transform: scale(1.05);
        }

        .reaction-item.user-reacted {
            background: rgba(0, 217, 255, 0.25);
            border-color: var(--primary-glow);
        }

        .reaction-emoji {
            font-size: 1rem;
        }

        .reaction-count {
            font-size: 0.75rem;
            color: var(--primary-glow);
            font-weight: 600;
        }

        .reaction-picker {
            position: absolute;
            bottom: 100%;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 100;
            margin-bottom: 5px;
        }

        .reaction-picker.show {
            display: flex;
            gap: 4px;
            animation: reactionSlideUp 0.2s ease;
        }

        @keyframes reactionSlideUp {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .quick-reaction {
            font-size: 1.3rem;
            padding: 6px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .quick-reaction:hover {
            background: rgba(0, 217, 255, 0.2);
            transform: scale(1.2);
        }

        .message-body img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        .message-body a {
            color: var(--primary-glow);

<body>
    <div class="app-container">

    <!-- Create Room Modal -->
    <div class="modal fade" id="createRoomModal" tabindex="-1">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let accessToken = null;
        let userId = null;
        let currentRoomId = null;
        let ws = null;
        let joinedRooms = [];
        let currentRoomMembers = [];

        // User presence tracking
        let userPresence = {}; // user_id -> {status: 'active'|'idle'|'offline', last_typing: timestamp}
        let typingTimeout = null;

        // Voice chat state (client-server audio)
        let inVoiceChannel = false;
        let isMuted = false;
        let localStream = null;
        let audioContext = null;
        let mediaStreamSource = null;
        let scriptProcessor = null;
        let voiceMembers = new Set();
        let voiceMemberStates = {}; // user_id -> {muted: bool, screen_sharing: bool}

        // Screen share state
        let isScreenSharing = false;
        let screenStream = null;
        let activeScreenSharers = new Set();
        let selectedScreenShare = null; // Track which screen share is currently selected for main view

        // Message reactions
        let messageReactions = {}; // event_id -> {emoji: count}

        // Mention tracking
        let roomMentions = {}; // room_id -> has unread mention

        // URL regex for detecting links
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        const imageExtensions = /\.(jpg|jpeg|png|gif|webp|bmp|svg)(\?.*)?$/i;

        // Emoji categories
        const emojiCategories = {
            'Smileys': ['😀', '😃', '😄', '😁', '😆', '😅', '🤣', '😂', '🙂', '🙃', '😉', '😊', '😇', '🥰', '😍', '🤩', '😘', '😗', '😚', '😙', '🥲', '😋', '😛', '😜', '🤪', '😝', '🤑', '🤗', '🤭', '🤫', '🤔'],
            'Gestures': ['👍', '👎', '👊', '✊', '🤛', '🤜', '🤞', '✌️', '🤟', '🤘', '👌', '🤌', '🤏', '👈', '👉', '👆', '👇', '☝️', '👋', '🤚', '🖐️', '✋', '🖖', '👏', '🙌', '🤲', '🤝', '🙏'],
            'Emotions': ['❤️', '🧡', '💛', '💚', '💙', '💜', '🖤', '🤍', '🤎', '💔', '❤️‍🔥', '❤️‍🩹', '💕', '💞', '💓', '💗', '💖', '💘', '💝', '💟', '☮️', '✝️', '☪️', '🕉️', '☸️', '✡️', '🔯', '🕎'],
            'Objects': ['💬', '💭', '🗨️', '🗯️', '💤', '💢', '💫', '💥', '💨', '💦', '💪', '🦾', '🦿', '🦵', '🦶', '👂', '🦻', '👃', '🧠', '🫀', '🫁', '🦷', '🦴', '👀', '👁️', '👅'],
            'Nature': ['🌱', '🌲', '🌳', '🌴', '🌵', '🌾', '🌿', '☘️', '🍀', '🍁', '🍂', '🍃', '🌺', '🌻', '🌹', '🥀', '🌷', '🌸', '💐', '🏵️', '🌼', '🌗', '⭐', '🌟', '✨', '⚡', '🔥', '💧'],
            'Food': ['🍕', '🍔', '🍟', '🌭', '🍿', '🧂', '🥓', '🥚', '🍳', '🥞', '🧇', '🧈', '🍞', '🥐', '🥨', '🥯', '🥖', '🧀', '🥗', '🥙', '🌮', '🌯', '🥪', '🍖', '🍗', '🥩', '🍠', '🍕'],
            'Activities': ['⚽', '🏀', '🏈', '⚾', '🥎', '🎾', '🏐', '🏉', '🥏', '🎱', '🏓', '🏸', '🏒', '🏑', '🥍', '🏏', '🥅', '⛳', '🏹', '🎣', '🥊', '🥋', '🎽', '🛹', '🛼', '🛷', '⛸️', '🥌'],
            'Travel': ['🚗', '🚕', '🚙', '🚌', '🚎', '🏎️', '🚓', '🚑', '🚒', '🚐', '🛻', '🚚', '🚛', '🚜', '🏍️', '🛵', '🚲', '🛴', '✈️', '🚀', '🛸', '🚁', '🛶', '⛵', '🚤', '⛴️', '🚢', '⚓']
        };

        // Initialize emoji picker
        function initializeEmojiPicker() {
            const emojiPicker = document.getElementById('emojiPicker');
            emojiPicker.innerHTML = '';

            for (const [category, emojis] of Object.entries(emojiCategories)) {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'emoji-category';
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'emoji-category-title';
                titleDiv.textContent = category;
                categoryDiv.appendChild(titleDiv);

                const gridDiv = document.createElement('div');
                gridDiv.className = 'emoji-grid';

                emojis.forEach(emoji => {
                    const emojiSpan = document.createElement('span');
                    emojiSpan.className = 'emoji-item';
                    emojiSpan.textContent = emoji;
                    emojiSpan.onclick = () => insertEmoji(emoji);
                    gridDiv.appendChild(emojiSpan);
                });

                categoryDiv.appendChild(gridDiv);
                emojiPicker.appendChild(categoryDiv);
            }
        }

        function toggleEmojiPicker(event) {
            event.stopPropagation();
            const picker = document.getElementById('emojiPicker');
            picker.classList.toggle('show');
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('messageInput');
            const cursorPos = input.selectionStart;
            const textBefore = input.value.substring(0, cursorPos);
            const textAfter = input.value.substring(cursorPos);
            
            input.value = textBefore + emoji + textAfter;
            input.focus();
            
            // Set cursor position after emoji
            const newPos = cursorPos + emoji.length;
            input.setSelectionRange(newPos, newPos);
            
            // Close picker
            document.getElementById('emojiPicker').classList.remove('show');
        }

        // Emoji Reactions
        const quickReactions = ['👍', '❤️', '😂', '😮', '😢', '🎉'];

        function showReactionPicker(eventId, roomId, event) {
            event.stopPropagation();
            
            // Close any existing pickers
            document.querySelectorAll('.reaction-picker').forEach(p => p.classList.remove('show'));
            
            // Find or create picker for this message
            const messageDiv = document.querySelector(`[data-event-id="${eventId}"]`);
            if (!messageDiv) return;
            
            let picker = messageDiv.querySelector('.reaction-picker');
            if (!picker) {
                picker = document.createElement('div');
                picker.className = 'reaction-picker';
                
                quickReactions.forEach(emoji => {
                    const emojiSpan = document.createElement('span');
                    emojiSpan.className = 'quick-reaction';
                    emojiSpan.textContent = emoji;
                    emojiSpan.onclick = () => addReaction(eventId, roomId, emoji);
                    picker.appendChild(emojiSpan);
                });
                
                const actionsDiv = messageDiv.querySelector('.message-actions');
                if (actionsDiv) {
                    actionsDiv.style.position = 'relative';
                    actionsDiv.appendChild(picker);
                }
            }
            
            picker.classList.toggle('show');
        }

        async function addReaction(eventId, roomId, emoji) {
            try {
                const response = await fetch(
                    `/_matrix/client/r0/rooms/${roomId}/send/m.reaction/${eventId}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${accessToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ emoji })
                    }
                );

                if (response.ok) {
                    // Close picker
                    document.querySelectorAll('.reaction-picker').forEach(p => p.classList.remove('show'));
                }
            } catch (error) {
                console.error('Error adding reaction:', error);
            }
        }

        function updateMessageReactions(eventId, reactions) {
            const messageDiv = document.querySelector(`[data-event-id="${eventId}"]`);
            if (!messageDiv) return;
            
            let reactionsContainer = messageDiv.querySelector('.message-reactions');
            if (!reactionsContainer) {
                reactionsContainer = document.createElement('div');
                reactionsContainer.className = 'message-reactions';
                messageDiv.appendChild(reactionsContainer);
            }
            
            reactionsContainer.innerHTML = '';
            
            for (const [emoji, userIds] of Object.entries(reactions)) {
                if (userIds.length === 0) continue;
                
                const reactionItem = document.createElement('div');
                reactionItem.className = 'reaction-item';
                if (userIds.includes(userId)) {
                    reactionItem.classList.add('user-reacted');
                }
                
                reactionItem.innerHTML = `

        async function startScreenShare() {
            try {
                // Get screen stream
                screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        cursor: 'always',
                        displaySurface: 'monitor'
                    },
                    audio: false
                });

                isScreenSharing = true;

                // Update UI
                document.getElementById('screenShareBtn').textContent = '🖥️ Stop Sharing';
                document.getElementById('screenShareBtn').classList.add('active');

                // Notify server
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'screen_share_start',
                        room_id: currentRoomId
                    }));
                }

                // Handle stream end (user clicks browser's stop sharing button)
                screenStream.getVideoTracks()[0].onended = () => {
                    stopScreenShare();
                };

                // Capture and send frames
                startScreenCapture();

            } catch (error) {
                console.error('Error starting screen share:', error);
                alert('Could not start screen sharing. Please check permissions.');
            }
        }

        async function stopScreenShare() {
            if (screenStream) {
                screenStream.getTracks().forEach(track => track.stop());
                screenStream = null;
            }

            isScreenSharing = false;

            // Update UI
            document.getElementById('screenShareBtn').textContent = '🖥️ Share Screen';
            document.getElementById('screenShareBtn').classList.remove('active');

            // Notify server
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'screen_share_stop',
                    room_id: currentRoomId
                }));
            }
        }

        function startScreenCapture() {
            const video = document.createElement('video');
            video.srcObject = screenStream;
            video.play();

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // Send frames at ~10 FPS for reasonable performance
            const captureInterval = setInterval(() => {
                if (!isScreenSharing || !screenStream) {
                    clearInterval(captureInterval);
                    return;
                }

                // Set canvas size to match video
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                // Draw current frame
                ctx.drawImage(video, 0, 0);

                // Convert to JPEG and send
                canvas.toBlob((blob) => {
                    if (blob && ws && ws.readyState === WebSocket.OPEN) {
                        blob.arrayBuffer().then(buffer => {
                            // Send screen frame with header
                            const header = new TextEncoder().encode('SCREEN:');
                            const combined = new Uint8Array(header.length + buffer.byteLength);
                            combined.set(header, 0);
                            combined.set(new Uint8Array(buffer), header.length);
                            ws.send(combined.buffer);
                        });
                    }
                }, 'image/jpeg', 0.7);
            }, 100); // 10 FPS
        }

        function updateScreenShareVideo(imageData, canvas, video) {
            // Convert array buffer to blob URL
            const blob = new Blob([imageData], { type: 'image/jpeg' });
            const url = URL.createObjectURL(blob);

            // Load and draw the image
            const img = new Image();
            img.onload = () => {
                // Only resize canvas if dimensions changed
                if (canvas.width !== img.width || canvas.height !== img.height) {
                    canvas.width = img.width;
                    canvas.height = img.height;
                }

                const ctx = canvas.getContext('2d', { alpha: false });
                ctx.drawImage(img, 0, 0);

                // Create stream only once
                if (!video.srcObject) {
                    const stream = canvas.captureStream(30);
                    video.srcObject = stream;
                    video.play();
                }

                URL.revokeObjectURL(url);
            };
            
            // Set crossOrigin to avoid potential CORS issues
            img.crossOrigin = 'anonymous';
            img.src = url;
        }

        async function joinVoice() {
            try {
                // Request microphone access
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 48000
                    }, 
                    video: false 
                });

                // Set up audio processing
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
                mediaStreamSource = audioContext.createMediaStreamSource(localStream);
                scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);

                // Process and send audio data to server
                scriptProcessor.onaudioprocess = (e) => {
                    if (isMuted || !ws || ws.readyState !== WebSocket.OPEN) {
                        return;
                    }

                    const inputData = e.inputBuffer.getChannelData(0);
                    // Convert float32 to int16
                    const int16Data = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        const s = Math.max(-1, Math.min(1, inputData[i]));
                        int16Data[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    
                    // Send audio data as binary with AUDIO: prefix
                    if (ws.readyState === WebSocket.OPEN) {
                        const header = new TextEncoder().encode('AUDIO:');
                        const combined = new Uint8Array(header.length + int16Data.byteLength);
                        combined.set(header, 0);
                        combined.set(new Uint8Array(int16Data.buffer), header.length);
                        ws.send(combined.buffer);
                    }
                };

                mediaStreamSource.connect(scriptProcessor);
                scriptProcessor.connect(audioContext.destination);

                inVoiceChannel = true;
                
                // Update UI
                document.getElementById('voiceBtn').textContent = '🔇 Leave Voice';
                document.getElementById('voiceBtn').classList.add('active');
                document.getElementById('muteBtn').classList.add('visible');
                document.getElementById('screenShareBtn').classList.add('visible');
                document.getElementById('voiceIndicator').classList.add('active');
                document.getElementById('voiceMembersList').classList.add('active');

                // Notify server via JSON message
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'voice_join',
                        room_id: currentRoomId
                    }));
                }

                // Load current voice members
                await loadVoiceMembers();

            } catch (error) {
                console.error('Error accessing microphone:', error);
                alert('Could not access microphone. Please check permissions.');
            }
        }

        async function leaveVoice() {
            // Stop screen sharing if active
            if (isScreenSharing) {
                await stopScreenShare();
            }

            // Hide all incoming screen shares
            hideScreenShare();

            // Stop audio processing
            if (scriptProcessor) {
                scriptProcessor.disconnect();
                scriptProcessor = null;
            }
            if (mediaStreamSource) {
                mediaStreamSource.disconnect();
                mediaStreamSource = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            // Stop local stream
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            inVoiceChannel = false;
            isMuted = false;

            // Update UI
            document.getElementById('voiceBtn').textContent = '🔊 Join Voice';
            document.getElementById('voiceBtn').classList.remove('active');
            document.getElementById('muteBtn').classList.remove('visible', 'muted');
            document.getElementById('muteBtn').textContent = '🎤 Mute';
            document.getElementById('screenShareBtn').classList.remove('visible', 'active');
            document.getElementById('voiceIndicator').classList.remove('active');
            document.getElementById('viewToggleTabs').classList.remove('active');
            
            // Switch back to chat view when leaving voice
            if (currentView === 'voice') {
                switchView('chat');
            }
            
            // Don't hide voice members list - let updateVoiceMembersList decide based on if anyone is in voice

            // Notify server
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'voice_leave',
                    room_id: currentRoomId
                }));
            }

            // Reload voice members to see who's still in voice
            await loadVoiceMembers();
        }

        function toggleMute() {

            }
        }

        async function loadVoiceMembers() {
            try {
                const response = await fetch(`/api/rooms/${currentRoomId}/voice`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }

                if (response.ok) {
                    const data = await response.json();
                    voiceMembers = new Set(data.voice_members.map(m => m.user_id));
                    
                    // Update member states and rebuild active screen sharers
                    voiceMemberStates = {};
                    activeScreenSharers.clear();
                    data.voice_members.forEach(member => {
                        voiceMemberStates[member.user_id] = {
                            muted: member.muted,
                            screen_sharing: member.screen_sharing
                        };
                        // Track all active screen sharers so late joiners see their streams
                        if (member.screen_sharing && member.user_id !== userId) {
                            activeScreenSharers.add(member.user_id);
                        }
                    });

                    updateVoiceMembersList();
                }
            } catch (error) {
                console.error('Error loading voice members:', error);

        // Set up audio playback from server

        function initAudioPlayback() {
            if (!audioPlaybackContext) {
                audioPlaybackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
            }
        }

        async function playAudioChunk(audioData) {
            initAudioPlayback();
            
            // Convert Int16Array to Float32Array
            const int16Array = new Int16Array(audioData);
            const float32Array = new Float32Array(int16Array.length);
            for (let i = 0; i < int16Array.length; i++) {
                float32Array[i] = int16Array[i] / (int16Array[i] < 0 ? 0x8000 : 0x7FFF);
            }
            
            // Create audio buffer
            const audioBuffer = audioPlaybackContext.createBuffer(1, float32Array.length, 48000);
            audioBuffer.getChannelData(0).set(float32Array);
            
            // Play the buffer
            const source = audioPlaybackContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioPlaybackContext.destination);
            source.start();
        }
