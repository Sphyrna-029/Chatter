<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Protocol Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-glow: #00d9ff;
            --secondary-glow: #7b2ff7;
            --bg-dark: #0a0e1a;
            --bg-card: #13182b;
            --border-color: #1e2841;
            --text-muted: #6b7c9e;
            --success-color: #00ff9d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(0, 217, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(123, 47, 247, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            color: #e4e8f0;
        }

        .app-container {
            max-width: 100%;
            margin: 0;
            padding: 20px 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            text-align: center;
            margin: 0 20px 30px 20px;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(19, 24, 43, 0.7) 100%);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }

        .app-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-glow), var(--secondary-glow), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            margin-top: 8px;
        }

        .login-card, .chat-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .login-card {
            max-width: 450px;
            margin: 0 auto;
        }

        .form-control, .form-select {
            background: rgba(10, 14, 26, 0.7);
            border: 1px solid var(--border-color);
            color: #e4e8f0;
            font-family: 'Outfit', sans-serif;
            border-radius: 8px;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            background: rgba(10, 14, 26, 0.9);
            border-color: var(--primary-glow);
            box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.1);
            color: #fff;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.4);
        }

        .btn-outline-primary {
            border: 2px solid var(--primary-glow);
            color: var(--primary-glow);
            background: transparent;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-outline-primary:hover {
            background: var(--primary-glow);
            color: var(--bg-dark);
            transform: translateY(-2px);
        }

        .chat-container {
            flex: 1;
            display: flex;
            gap: 20px;
            min-height: 0;
            padding: 0 20px;
        }

        .sidebar {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .user-info {
            background: rgba(0, 217, 255, 0.05);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .user-details {
            flex: 1;
            overflow: hidden;
        }

        .user-name {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-id {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .rooms-panel {
            flex: 1;
            background: rgba(10, 14, 26, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
        }

        .rooms-panel h5 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .room-item {
            background: rgba(19, 24, 43, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .room-item:hover {
            background: rgba(19, 24, 43, 0.9);
            border-color: var(--primary-glow);
            transform: translateX(5px);
        }

        .room-item:hover .room-leave-btn {
            opacity: 1;
        }

        .room-item.active {
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.15), rgba(123, 47, 247, 0.15));
            border-color: var(--primary-glow);
        }

        .room-mention-badge {
            position: absolute;
            top: -4px;
            left: -4px;
            width: 12px;
            height: 12px;
            background: #0066ff;
            border: 2px solid var(--bg-card);
            border-radius: 50%;
            display: none;
            animation: mentionPulse 2s infinite;
        }

        .room-mention-badge.show {
            display: block;
        }

        @keyframes mentionPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(0, 102, 255, 0.7);
            }
            50% {
                box-shadow: 0 0 0 6px rgba(0, 102, 255, 0);
            }
        }

        .room-leave-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 59, 48, 0.2);
            border: 1px solid rgba(255, 59, 48, 0.5);
            color: #ff3b30;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0;
            z-index: 10;
        }

        .room-leave-btn:hover {
            background: rgba(255, 59, 48, 0.4);
            border-color: #ff3b30;
            transform: scale(1.05);
        }

        .mention {
            background: rgba(0, 102, 255, 0.2);
            color: #0066ff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mention:hover {
            background: rgba(0, 102, 255, 0.3);
        }

        .mention-autocomplete {
            position: absolute;
            bottom: 100%;
            left: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 100;
            margin-bottom: 5px;
            max-height: 200px;
            overflow-y: auto;
            min-width: 200px;
        }

        .mention-autocomplete.show {
            display: block;
            animation: mentionSlideUp 0.2s ease;
        }

        @keyframes mentionSlideUp {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .mention-option {
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mention-option:hover, .mention-option.selected {
            background: rgba(0, 102, 255, 0.2);
        }

        .mention-option-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .mention-option-name {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .room-name {
            font-weight: 600;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .room-dm-icon {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .room-topic {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            background: rgba(10, 14, 26, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .view-toggle-tabs {
            display: none;
            gap: 8px;
            margin-top: 10px;
            width: 100%;
        }

        .view-toggle-tabs.active {
            display: flex;
        }

        .view-toggle-tab {
            flex: 1;
            padding: 8px 16px;
            background: rgba(10, 14, 26, 0.7);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .view-toggle-tab:hover {
            border-color: var(--primary-glow);
            color: var(--primary-glow);
        }

        .view-toggle-tab.active {
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border-color: transparent;
            color: white;
        }

        .chat-view-container,
        .voice-view-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .chat-view-container.hidden,
        .voice-view-container.hidden {
            display: none;
        }

        .voice-view-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-header-info {
            flex: 1;
        }

        .voice-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-voice {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-voice:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-voice.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .btn-voice.active:hover {
            box-shadow: 0 5px 20px rgba(239, 68, 68, 0.4);
        }

        .btn-screen-share {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .btn-screen-share.visible {
            display: block;
        }

        .btn-screen-share.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .btn-screen-share:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
        }

        .btn-screen-share.active:hover {
            box-shadow: 0 5px 20px rgba(239, 68, 68, 0.4);
        }

        .btn-mute {
            background: rgba(100, 100, 100, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .btn-mute.visible {
            display: block;
        }

        .btn-mute.muted {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
            color: #ef4444;
        }

        .btn-mute:hover {
            background: rgba(100, 100, 100, 0.5);
        }

        .btn-debug {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: 600;
            color: #93c5fd;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-debug:hover {
            background: rgba(59, 130, 246, 0.32);
            border-color: rgba(59, 130, 246, 0.6);
            color: #dbeafe;
        }

        .btn-debug.active {
            background: rgba(59, 130, 246, 0.42);
            border-color: rgba(96, 165, 250, 0.8);
            color: #eff6ff;
        }

        .screen-debug-panel {
            position: fixed;
            right: 18px;
            bottom: 16px;
            width: 340px;
            max-width: calc(100vw - 24px);
            background: rgba(10, 14, 26, 0.95);
            border: 1px solid rgba(59, 130, 246, 0.5);
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            padding: 10px 12px;
            color: #dbeafe;
            font-size: 0.78rem;
            line-height: 1.35;
            z-index: 2500;
            display: none;
        }

        .screen-debug-panel.visible {
            display: block;
        }

        .screen-debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #93c5fd;
        }

        .screen-debug-status {
            font-weight: 600;
            color: #bfdbfe;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .screen-debug-section {
            border-top: 1px solid rgba(59, 130, 246, 0.24);
            padding-top: 6px;
            margin-top: 6px;
        }

        .screen-debug-section:first-child {
            border-top: none;
            padding-top: 0;
            margin-top: 0;
        }

        .screen-debug-label {
            color: #93c5fd;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .screen-debug-line {
            color: #dbeafe;
            margin: 2px 0;
            word-break: break-word;
        }

        .screen-debug-empty {
            color: #94a3b8;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .screen-debug-panel {
                left: 12px;
                right: 12px;
                width: auto;
                bottom: 12px;
                font-size: 0.74rem;
            }
        }

        .screen-share-container {
            margin-bottom: 15px;
            background: rgba(10, 14, 26, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: none;
        }

        .screen-share-container.active {
            display: block;
        }

        .screen-share-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
            padding: 0;
        }

        .screen-share-preview {
            position: relative;
            background: rgba(10, 14, 26, 0.9);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
        }

        .screen-share-preview > * {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .screen-share-preview:hover {
            border-color: #8b5cf6;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.3);
        }

        .screen-share-preview.selected {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .screen-share-preview-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            backface-visibility: hidden;
            transform: translateZ(0);
            will-change: transform;
        }

        .screen-share-preview-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px 12px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            color: #8b5cf6;
            font-size: 0.85rem;
            font-weight: 600;
            pointer-events: none;
        }

        .screen-share-main {
            background: rgba(10, 14, 26, 0.9);
            border: 2px solid #8b5cf6;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .screen-share-main-header {
            padding: 12px 16px;
            background: rgba(139, 92, 246, 0.1);
            border-bottom: 1px solid rgba(139, 92, 246, 0.3);
        }

        .screen-share-main-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #8b5cf6;
            margin: 0;
        }

        .screen-share-main-video {
            width: 100%;
            max-height: 600px;
            background: #000;
            display: block;
            backface-visibility: hidden;
            transform: translateZ(0);
            will-change: transform;
        }

        .voice-members-list {
            padding: 10px 15px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            margin-bottom: 10px;
            display: none;
        }

        .voice-members-list.active {
            display: block;
        }

        .voice-members-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #10b981;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .voice-member-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 0.9rem;
        }

        .voice-member-icon {
            font-size: 1rem;
        }

        .voice-member-name {
            flex: 1;
        }

        .voice-member-sharing {
            color: #8b5cf6;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .voice-member-muted {
            color: #ef4444;
            font-size: 0.75rem;
        }

        .voice-volume-slider {
            width: 70px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #4b5563;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            flex-shrink: 0;
        }

        .voice-volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #8b5cf6;
            cursor: pointer;
            border: none;
        }

        .voice-volume-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #8b5cf6;
            cursor: pointer;
            border: none;
        }

        .voice-volume-slider::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;
        }

        .voice-volume-label {
            font-size: 0.7rem;
            color: #9ca3af;
            min-width: 30px;
            text-align: right;
            flex-shrink: 0;
        }

        .btn-ptt-toggle {
            background: rgba(100, 100, 100, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
            font-size: 0.85rem;
        }

        .btn-ptt-toggle.visible {
            display: block;
        }

        .btn-ptt-toggle.ptt-mode {
            background: rgba(139, 92, 246, 0.3);
            border-color: #8b5cf6;
            color: #c4b5fd;
        }

        .btn-ptt-toggle:hover {
            background: rgba(100, 100, 100, 0.5);
        }

        .btn-ptt-toggle.ptt-mode:hover {
            background: rgba(139, 92, 246, 0.5);
        }

        .ptt-active-indicator {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            border-radius: 8px;
            color: #10b981;
            font-size: 0.8rem;
            font-weight: 600;
            animation: pttPulse 1s ease-in-out infinite;
        }

        .ptt-active-indicator.active {
            display: flex;
        }

        @keyframes pttPulse {
            0%, 100% { opacity: 0.7; }

        .member-count {

            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;

        .message-input-container {
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
        }

        .btn-send {
            background: linear-gradient(135deg, var(--success-color), #00b377);

            font-weight: 600;

            50% { opacity: 0.5; }

        .badge {
            background: rgba(0, 217, 255, 0.2);
            color: var(--primary-glow);
            border: 1px solid var(--primary-glow);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
        }

            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;

        }

            .chat-container {

            .members-panel {
                width: 100%;
                max-height: 200px;
            }

    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <h1>⚡ MATRIX CHAT</h1>
            <div class="app-subtitle">Decentralized Communication Protocol</div>
        </div>

        <!-- Login Screen -->
        <div id="loginScreen" class="login-card">
            <h3 class="mb-4 text-center">Connect to Matrix</h3>
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="loginUsername" placeholder="Enter your username">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password">
            </div>
            <div class="d-grid gap-2 mb-3">
                <button class="btn btn-primary" onclick="login()">Login</button>
            </div>
            <div class="d-grid gap-2">
                <button class="btn btn-outline-primary" onclick="register()">Register New Account</button>
            </div>
            <div id="loginError" class="alert alert-danger mt-3 d-none"></div>
        </div>

        <!-- Chat Interface -->
        <div id="chatScreen" class="chat-container d-none">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-details">
                        <div class="user-name" id="userName">User</div>
                        <div class="user-id" id="userId">@user:localhost</div>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary" onclick="showCreateRoomModal()">
                        + Create Room
                    </button>
                    <button class="btn btn-outline-primary" onclick="showJoinRoomModal()">
                        Join Room
                    </button>
                    <button class="btn btn-outline-primary" onclick="logout()">
                        Logout
                    </button>
                </div>

                <div class="rooms-panel">
                    <h5>Your Rooms</h5>
                    <div id="roomsList"></div>
                </div>
            </div>

            <!-- Main Chat Area -->
            <div class="main-chat">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <h4 class="chat-title" id="currentRoomName">Select a room</h4>
                        <p class="chat-subtitle" id="currentRoomTopic"></p>
                    </div>
                    <div class="voice-controls">
                        <div class="voice-indicator" id="voiceIndicator">
                            <div class="voice-wave"></div>
                            <div class="voice-wave"></div>
                            <div class="voice-wave"></div>
                            <span>In Voice</span>
                        </div>
                        <button class="btn-debug" id="debugPanelToggleBtn" onclick="toggleScreenDebugPanel()">🐞 Debug</button>
                        <button class="btn-screen-share" id="screenShareBtn" onclick="toggleScreenShare()">🖥️ Share Screen</button>
                        <button class="btn-mute" id="muteBtn" onclick="toggleMute()">🎤 Mute</button>
                        <button class="btn-ptt-toggle" id="pttToggleBtn" onclick="toggleInputMode()">🎙 Open Mic</button>
                        <div class="ptt-active-indicator" id="pttActiveIndicator">🔊 Transmitting</div>
                        <button class="btn-voice" id="voiceBtn" onclick="toggleVoice()">🔊 Join Voice</button>
                    </div>
                    
                    <!-- View Toggle Tabs (only shown when in voice) -->
                    <div class="view-toggle-tabs" id="viewToggleTabs">
                        <button class="view-toggle-tab active" onclick="switchView('chat')">
                            💬 Text Chat
                        </button>
                        <button class="view-toggle-tab" onclick="switchView('voice')">
                            🎙️ Voice & Screen Share
                        </button>
                    </div>
                </div>

                <!-- Chat View -->
                <div class="chat-view-container" id="chatViewContainer">
                    <div class="voice-members-list" id="voiceMembersList">
                        <div class="voice-members-title">In Voice Channel</div>
                        <div id="voiceMembersContainer"></div>
                    </div>

                    <div class="messages-container" id="messagesContainer">
                        <div class="empty-state">
                            <div class="empty-state-icon">💬</div>
                            <p>Select a room to start chatting</p>
                        </div>
                    </div>

                    <div class="message-input-container">
                        <div class="message-input-wrapper">
                            <input type="text" class="form-control message-input" id="messageInput" 
                                   placeholder="Type your message..." 
                                   onkeypress="handleMessageKeyPress(event)"
                                   onkeyup="handleMentionAutocomplete(event); sendTypingIndicator();"
                                   onkeydown="handleMentionKeydown(event)">
                            <div class="mention-autocomplete" id="mentionAutocomplete"></div>
                            <button class="emoji-picker-btn" onclick="toggleEmojiPicker(event)">😊</button>
                            <div class="emoji-picker" id="emojiPicker"></div>
                        </div>
                        <button class="btn btn-send" onclick="sendMessage()">Send</button>
                    </div>
                </div>

                <!-- Voice & Screen Share View -->
                <div class="voice-view-container hidden" id="voiceViewContainer">
                    <div class="voice-view-content">
                        <div class="voice-members-list active">
                            <div class="voice-members-title">In Voice Channel</div>
                            <div id="voiceMembersContainerAlt"></div>
                        </div>
                        
                        <div id="screenShareWrapper"></div>
                    </div>
                </div>
            </div>

            <div class="screen-debug-panel" id="screenDebugPanel">
                <div class="screen-debug-header">
                    <span>Screen Telemetry</span>
                    <span class="screen-debug-status" id="screenDebugStatus">IDLE</span>
                </div>
                <div id="screenDebugBody" class="screen-debug-empty">No telemetry yet.</div>
            </div>

            <!-- Members Panel -->
            <div class="members-panel" id="membersPanel">
                <h5>Members <span class="member-count" id="memberCount">0</span></h5>
                <div id="membersList"></div>
            </div>
        </div>
    </div>

    <!-- Create Room Modal -->
    <div class="modal fade" id="createRoomModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Room</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Room Name</label>
                        <input type="text" class="form-control" id="createRoomName" placeholder="My Awesome Room">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Room Topic (Optional)</label>
                        <input type="text" class="form-control" id="createRoomTopic" placeholder="Discuss awesome things">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createRoom()">Create Room</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Join Room Modal -->
    <div class="modal fade" id="joinRoomModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Join a Room</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Available Rooms</label>
                        <select class="form-select" id="availableRoomsList" size="5">
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="joinRoom()">Join Room</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let accessToken = null;
        let userId = null;
        let currentRoomId = null;
        let ws = null;
        let joinedRooms = [];
        let currentRoomMembers = [];

        // User presence tracking
        let userPresence = {}; // user_id -> {status: 'active'|'idle'|'offline', last_typing: timestamp}
        let typingTimeout = null;

        // Voice chat state
        let inVoiceChannel = false;
        let isMuted = false;
        let voiceInputMode = 'open'; // 'open' or 'ptt'
        let pttKeyHeld = false;
        let pttKey = '`'; // backtick/tilde
        let localStream = null;
        let voiceMembers = new Set();
        let voiceMemberStates = {}; // user_id -> {muted: bool, screen_sharing: bool}

        // Voice WebRTC state
        let voicePublisherPc = null;
        let voiceSubscriberPcs = new Map(); // speaker_user_id -> RTCPeerConnection
        let voiceAudioElements = new Map(); // speaker_user_id -> HTMLAudioElement
        let voiceUserVolumes = {}; // speaker_user_id -> 0.0-1.0, default 1.0
        let pendingVoiceSubscriptions = new Set();
        const VOICE_SUBSCRIBE_RETRY_MS = 750;
        let voiceSubscriptionRetryTimers = new Map();

        // Screen share state
        let isScreenSharing = false;
        let screenStream = null;
        let activeScreenSharers = new Set();
        let selectedScreenShare = null; // Track which screen share is currently selected for main view
        let screenPublisherPc = null;
        let screenSubscriberPcs = new Map(); // sharer_user_id -> RTCPeerConnection
        let incomingScreenStreams = new Map(); // sharer_user_id -> MediaStream
        let pendingScreenSubscriptions = new Set();
        let subscriptionRetryTimers = new Map();
        let screenPublisherQualityTimer = null;
        let screenSubscriberTelemetryTimers = new Map();
        const SCREEN_SUBSCRIBE_RETRY_MS = 750;
        const SCREEN_TARGET_WIDTH = 1920;
        const SCREEN_TARGET_HEIGHT = 1080;
        const SCREEN_TARGET_FPS = 30;
        const SCREEN_QUALITY_SAMPLE_MS = 2000;
        const SCREEN_TELEMETRY_SAMPLE_MS = 2000;
        const WEBRTC_CONFIG = {
            iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }]
        };
        let screenDebugPanelVisible = false;
        let screenPublisherTelemetry = null;
        let screenSubscriberTelemetry = new Map(); // sharer_user_id -> latest telemetry snapshot

        // Message reactions
        let messageReactions = {}; // event_id -> {emoji: count}

        // Mention tracking
        let roomMentions = {}; // room_id -> has unread mention

        // URL regex for detecting links
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        const imageExtensions = /\.(jpg|jpeg|png|gif|webp|bmp|svg)(\?.*)?$/i;

        // Emoji categories

        function insertEmoji(emoji) {
            const input = document.getElementById('messageInput');
            const cursorPos = input.selectionStart;
            const textBefore = input.value.substring(0, cursorPos);
            const textAfter = input.value.substring(cursorPos);
            
            input.value = textBefore + emoji + textAfter;
            input.focus();
            
            // Set cursor position after emoji
            const newPos = cursorPos + emoji.length;
            input.setSelectionRange(newPos, newPos);
            
            // Close picker
            document.getElementById('emojiPicker').classList.remove('show');
        }

        function showReactionPicker(eventId, roomId, event) {
            event.stopPropagation();
            
            // Close any existing pickers
            document.querySelectorAll('.reaction-picker').forEach(p => p.classList.remove('show'));
            
            // Find or create picker for this message
            const messageDiv = document.querySelector(`[data-event-id="${eventId}"]`);
            if (!messageDiv) return;
            
            let picker = messageDiv.querySelector('.reaction-picker');
            if (!picker) {
                picker = document.createElement('div');
                picker.className = 'reaction-picker';
                
                quickReactions.forEach(emoji => {
                    const emojiSpan = document.createElement('span');
                    emojiSpan.className = 'quick-reaction';
                    emojiSpan.textContent = emoji;
                    emojiSpan.onclick = () => addReaction(eventId, roomId, emoji);
                    picker.appendChild(emojiSpan);
                });
                
                const actionsDiv = messageDiv.querySelector('.message-actions');
                if (actionsDiv) {
                    actionsDiv.style.position = 'relative';
                    actionsDiv.appendChild(picker);
                }
            }
            
            picker.classList.toggle('show');

        async function addReaction(eventId, roomId, emoji) {
            try {
                const response = await fetch(
                    `/_matrix/client/r0/rooms/${roomId}/send/m.reaction/${eventId}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${accessToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ emoji })
                    }
                );

                if (response.ok) {
                    // Close picker
                    document.querySelectorAll('.reaction-picker').forEach(p => p.classList.remove('show'));
                }
            } catch (error) {
                console.error('Error adding reaction:', error);
            }
        }

        function updateMessageReactions(eventId, reactions) {
            const messageDiv = document.querySelector(`[data-event-id="${eventId}"]`);
            if (!messageDiv) return;
            
            let reactionsContainer = messageDiv.querySelector('.message-reactions');
            if (!reactionsContainer) {
                reactionsContainer = document.createElement('div');
                reactionsContainer.className = 'message-reactions';
                messageDiv.appendChild(reactionsContainer);
            }
            
            reactionsContainer.innerHTML = '';
            
            for (const [emoji, userIds] of Object.entries(reactions)) {
                if (userIds.length === 0) continue;
                
                const reactionItem = document.createElement('div');
                reactionItem.className = 'reaction-item';
                if (userIds.includes(userId)) {
                    reactionItem.classList.add('user-reacted');
                }
                
                reactionItem.innerHTML = `
                    <span class="reaction-emoji">${emoji}</span>
                    <span class="reaction-count">${userIds.length}</span>
                `;
                
                reactionItem.onclick = () => {
                    const roomId = messageDiv.closest('[data-room-id]')?.dataset.roomId || currentRoomId;
                    addReaction(eventId, roomId, emoji);
                };
                
                reactionsContainer.appendChild(reactionItem);

        function scheduleScreenSubscriptionRetry(sharerUserId, delayMs = SCREEN_SUBSCRIBE_RETRY_MS) {
            if (subscriptionRetryTimers.has(sharerUserId)) {
                return;
            }

            const timer = setTimeout(() => {
                subscriptionRetryTimers.delete(sharerUserId);
                if (inVoiceChannel && activeScreenSharers.has(sharerUserId) && sharerUserId !== userId) {
                    ensureScreenSubscriber(sharerUserId);
                }
            }, delayMs);

            subscriptionRetryTimers.set(sharerUserId, timer);
        }

        function cancelScreenSubscriptionRetry(sharerUserId) {
            const timer = subscriptionRetryTimers.get(sharerUserId);
            if (timer) {
                clearTimeout(timer);
                subscriptionRetryTimers.delete(sharerUserId);
            }
        }

        function clearAllScreenSubscriptionRetries() {
            subscriptionRetryTimers.forEach(timer => clearTimeout(timer));
            subscriptionRetryTimers.clear();
        }

        function canSignalOverWebSocket() {

            return fullUserId.split(':')[0].replace('@', '') || fullUserId;

                        <div class="screen-debug-line">Quality: ${p.meetsThreshold ? '✓ Near target' : '⚠ Below target (adapting)'}</div>
