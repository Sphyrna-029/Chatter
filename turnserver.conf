# Chatter TURN server configuration
# Update the values below for your environment

# Listen on all interfaces
listening-port=3478

# Your server's public IP address (REQUIRED - change this)
#external-ip=YOUR_PUBLIC_IP

# Relay port range — forward these UDP ports on your firewall
min-port=49152
max-port=49252

# Credentials (must match TURN_USERNAME/TURN_PASSWORD in docker-compose)
user=chatter:changeme

# Realm
realm=chatter

# Logging
log-file=stdout

# Security
no-multicast-peers
no-cli
